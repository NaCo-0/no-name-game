<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Kingdoms: Realm & World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;700&family=Vazirmatn:wght@400;500;600;700&family=Amiri:wght@700&family=Bitter:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="./kingdom_art/kingdom_data.js"></script>
<style>
  :root { --canvas: #05070a; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { background: var(--canvas); color: #eee; font-family: 'Inter', -apple-system, sans-serif; position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }
  #root { height: 100%; display: flex; flex-direction: column; }
  svg { display: block; }
  .icon { width: 1em; height: 1em; flex-shrink: 0; }
  button, input { font-family: inherit; }

  /* ===== TOP HUD ===== */
  .hud-top { position: relative; z-index: 50; flex-shrink: 0; padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px; background: var(--panel-color); border-bottom: 1px solid var(--border-color); }
  .hud-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .realm-crest { width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); display: flex; align-items: center; justify-content: center; color: var(--highlight-color); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .realm-crest .icon { width: 18px; height: 18px; }
  .ledger { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .ledger::-webkit-scrollbar { display: none; }
  .ledger-cell { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 9px; background: var(--paneldeep-color); border: 1px solid var(--border-color); white-space: nowrap; flex-shrink: 0; }
  .ledger-cell .icon { width: 14px; height: 14px; color: var(--accent-color); }
  .ledger-cell b { font-size: 11.5px; color: var(--ink-color); font-variant-numeric: tabular-nums; font-weight: 600; }
  .ledger-cell.coin .icon, .ledger-cell.coin b { color: var(--highlight-color); }
  
  .mode-switch-btn {
    padding: 6px 12px; border-radius: 9px; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color));
    border: 1px solid var(--highlight-color); color: #fff; font-size: 11.5px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0;
    transition: transform .12s, filter .12s;
  }
  .mode-switch-btn:active { transform: scale(.96); filter: brightness(1.1); }

  .menu-toggle { width: 34px; height: 34px; flex-shrink: 0; border-radius: 9px; background: var(--paneldeep-color); border: 1px solid var(--border-color); color: var(--ink-color); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .menu-toggle .icon { width: 16px; height: 16px; }
  .culture-row { display: flex; gap: 6px; margin-top: 7px; overflow-x: auto; scrollbar-width: none; }
  .culture-row::-webkit-scrollbar { display: none; }
  .culture-tab { flex: 0 0 auto; font-size: 12px; font-weight: 600; border: 1px solid var(--border-color); background: var(--paneldeep-color); color: var(--inksoft-color); padding: 6px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all .15s ease; }
  .culture-tab.active { color: #fff; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); border-color: var(--accent-color); box-shadow: 0 2px 6px rgba(0,0,0,.3); }

  /* ===== MAIN STAGE ===== */
  .stage { flex: 1; position: relative; overflow: hidden; min-height: 0; background: #000; }

  /* ===== CITY VIEW ===== */
  .city-container { position: absolute; inset: 0; overflow-x: auto; overflow-y: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  .city-inner { position: relative; height: 100%; width: max-content; }
  .city-inner img { height: 100%; width: auto; display: block; -webkit-user-select: none; user-select: none; pointer-events: none; }

  .hotspot { position: absolute; cursor: pointer; outline: none; }
  .plate {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: calc(var(--u) * .55);
    padding: calc(var(--u) * .35) calc(var(--u) * 1.0) calc(var(--u) * .35) calc(var(--u) * .45);
    background: linear-gradient(180deg, var(--plate-bg1), var(--plate-bg2));
    border: max(1px, calc(var(--u) * .16)) solid var(--plate-border);
    border-radius: var(--plate-radius);
    box-shadow: 0 calc(var(--u) * .25) calc(var(--u) * .8) rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.55);
    white-space: nowrap; cursor: pointer; z-index: 6;
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
  }
  .plate:hover, .plate.active { transform: translate(-50%, calc(-50% - var(--u) * .35)) scale(1.05); box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 1.3) rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.55); filter: brightness(1.06); }
  .plate-icon { width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); flex-shrink: 0; color: var(--plate-ink); display: flex; align-items: center; justify-content: center; }
  .plate-icon .icon { width: 100%; height: 100%; }
  .plate-text { display: flex; flex-direction: column; line-height: 1.12; text-align: center; }
  .plate-name { font-family: var(--plate-font); font-size: calc(var(--u) * 1.3); font-weight: 700; color: var(--plate-ink); }
  .plate-level { font-size: calc(var(--u) * 1.0); font-weight: 700; color: var(--plate-sub); letter-spacing: .04em; }

  .collect-badge {
    position: absolute; z-index: 7; cursor: pointer; transform: translate(-50%, -50%);
    width: calc(var(--u) * 2.9); height: calc(var(--u) * 2.9); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff6d6, var(--highlight-color) 55%, var(--accent-color));
    border: max(1.5px, calc(var(--u) * .2)) solid #fffaf0;
    display: flex; align-items: center; justify-content: center; color: #2a1d0e;
    box-shadow: 0 calc(var(--u) * .35) calc(var(--u) * 1) rgba(0,0,0,.55), 0 0 0 calc(var(--u) * .4) rgba(255,255,255,.1);
    animation: bob 1.1s ease-in-out infinite;
  }
  .collect-badge .icon { width: 56%; height: 56%; }
  .collect-badge .res { position: absolute; right: -18%; bottom: -18%; width: 46%; height: 46%; border-radius: 50%; background: #1b140c; color: var(--highlight-color); display: flex; align-items: center; justify-content: center; border: 1px solid var(--highlight-color); }
  .collect-badge .res .icon { width: 68%; height: 68%; }
  @keyframes bob { 0%,100% { margin-top: 0; } 50% { margin-top: calc(var(--u) * -.6); } }

  .float-pop { position: absolute; z-index: 30; pointer-events: none; font-size: calc(var(--u) * 1.5); font-weight: 800; color: var(--highlight-color); text-shadow: 0 1px 3px rgba(0,0,0,.85); animation: floatUp 1s ease-out forwards; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .float-pop .icon { width: 1em; height: 1em; }
  @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }

  .scroll-hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(10,10,12,.88); color: #eee; font-size: 11px; font-weight: 600; padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.15); pointer-events: none; z-index: 20; white-space: nowrap; transition: opacity .6s; opacity: 1; display: flex; align-items: center; gap: 6px; }
  .scroll-hint .icon { width: 12px; height: 12px; }
  .scroll-hint.hide { opacity: 0; }

  /* ===== WORLD MAP VIEW ===== */
  .world-map-wrap { position: absolute; inset: 0; overflow: hidden; background: #090c10; cursor: grab; }
  .world-map-wrap:active { cursor: grabbing; }
  #world-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .phaser-host { position: absolute; inset: 0; }
  .phaser-host canvas { display: block; touch-action: none; }
  .world-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; pointer-events: none; color: #64748b; font: 600 14px Inter, sans-serif; }

  /* Minimap Radar */
  .minimap-radar {
    position: absolute; top: 12px; right: 12px; width: 140px; height: 70px;
    background: rgba(8,12,18,.85); border: 1.5px solid var(--border-color);
    border-radius: 8px; overflow: hidden; z-index: 25; box-shadow: 0 4px 16px rgba(0,0,0,.6);
    backdrop-filter: blur(6px); cursor: pointer;
  }
  .minimap-radar canvas { width: 100%; height: 100%; display: block; }
  .minimap-label { position: absolute; bottom: 2px; right: 5px; font-size: 8px; font-weight: 700; color: var(--inksoft-color); pointer-events: none; letter-spacing: .05em; }

  /* World Navigation Controls */
  .world-controls {
    position: absolute; bottom: 20px; right: 14px; z-index: 25; display: flex; flex-direction: column; gap: 6px;
  }
  .world-btn {
    width: 36px; height: 36px; border-radius: 10px; background: rgba(18, 25, 34, 0.88);
    border: 1px solid var(--border-color); color: #eee; display: flex; align-items: center;
    justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); backdrop-filter: blur(4px);
    transition: transform .1s, background .15s;
  }
  .world-btn:active { transform: scale(.92); }
  .world-btn .icon { width: 16px; height: 16px; }

  /* Floating Territory HUD */
  .territory-hud {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(12, 18, 26, 0.88); border: 1px solid var(--border-color);
    padding: 6px 14px; border-radius: 999px; z-index: 25; backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.5);
    font-size: 11.5px; font-weight: 600; color: var(--ink-color); pointer-events: none;
  }
  .territory-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-color); box-shadow: 0 0 6px var(--accent-color); }

  /* Citadel Markers on Map */
  .citadel-marker {
    position: absolute; transform: translate(-50%, -100%); z-index: 15; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; cursor: pointer;
    transition: transform .15s ease, filter .15s ease;
  }
  .citadel-marker:hover { transform: translate(-50%, -105%) scale(1.06); filter: brightness(1.15); }
  .citadel-icon-wrap {
    width: 48px; height: 48px; border-radius: 14px; background: radial-gradient(circle, var(--accent-color), var(--paneldeep-color));
    border: 2px solid var(--highlight-color); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.7), 0 0 12px var(--accent-color);
  }
  .citadel-icon-wrap img { width: 75%; height: 75%; object-fit: contain; }
  .citadel-banner {
    margin-top: 3px; background: rgba(10,14,20,.9); border: 1px solid var(--border-color);
    border-radius: 6px; padding: 2px 8px; font-size: 10px; font-weight: 700; color: #fff;
    white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.6); display: flex; align-items: center; gap: 4px;
  }
  .citadel-banner .tag { color: var(--highlight-color); }

  /* March Action Pop */
  .action-target-pop {
    position: absolute; z-index: 35; transform: translate(-50%, -115%);
    background: var(--panel-color); border: 1px solid var(--highlight-color);
    padding: 8px 12px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.7);
    display: flex; flex-direction: column; gap: 6px; min-width: 140px; text-align: center;
  }
  .action-target-pop b { font-size: 11.5px; color: var(--ink-color); }
  .action-target-pop .coord { font-size: 9.5px; color: var(--inksoft-color); }
  .march-btn {
    padding: 6px 10px; border-radius: 8px; border: none; font-size: 11px; font-weight: 700;
    cursor: pointer; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color));
    color: #fff; display: flex; align-items: center; justify-content: center; gap: 5px;
  }

  /* ===== BOTTOM NAV ===== */
  .hud-bottom { position: relative; z-index: 50; flex-shrink: 0; background: var(--panel-color); border-top: 1px solid var(--border-color); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: stretch; justify-content: space-around; }
  .nav-btn { background: transparent; border: none; color: var(--inksoft-color); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 10px; cursor: pointer; flex: 1; max-width: 80px; position: relative; transition: color .14s ease; }
  .nav-btn .nic { width: 21px; height: 21px; }
  .nav-btn span { font-size: 9.5px; font-weight: 600; }
  .nav-btn.active { color: var(--highlight-color); }
  .nav-btn .badge { position: absolute; top: -1px; right: 14px; background: #d1443a; color: #fff; font-size: 9px; min-width: 15px; height: 15px; border-radius: 999px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--panel-color); }

  /* ===== SHEETS ===== */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 90; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; backdrop-filter: blur(2px); }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; max-width: 500px; background: var(--panel-color); color: var(--ink-color); border-radius: 20px 20px 0 0; border: 1px solid var(--border-color); border-bottom: none; padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateY(20px); transition: transform .25s ease; box-shadow: 0 -14px 40px rgba(0,0,0,.6); max-height: 88vh; overflow-y: auto; }
  .overlay.open .sheet { transform: translateY(0); }
  @media (min-width: 720px) { .overlay { align-items: center; } .sheet { border-radius: 16px; border-bottom: 1px solid var(--border-color); } }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sheet-title { display: flex; align-items: center; gap: 10px; }
  .sheet-title .icon-wrap { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); display: flex; align-items: center; justify-content: center; color: #fff; }
  .sheet-title .icon-wrap .icon { width: 20px; height: 20px; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .level-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .level-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: color-mix(in srgb, var(--accent-color) 25%, transparent); color: var(--highlight-color); }
  .close-btn { background: var(--paneldeep-color); border: 1px solid var(--border-color); color: var(--ink-color); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .close-btn .icon { width: 14px; height: 14px; }
  .sheet-desc { color: var(--inksoft-color); font-size: 13.5px; line-height: 1.6; margin: 13px 0 16px; }
  .prod-row { display: flex; align-items: center; justify-content: space-between; background: var(--paneldeep-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; gap: 10px; }
  .prod-row .prod-info { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--inksoft-color); }
  .prod-row .prod-info .icon { width: 16px; height: 16px; color: var(--accent-color); }
  .prod-row .prod-amount { font-size: 15px; font-weight: 800; color: var(--highlight-color); }
  .collect-btn { width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; font-weight: 700; margin-bottom: 12px; background: linear-gradient(155deg, var(--highlight-color), var(--accent-color)); color: #14100c; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .collect-btn:disabled { opacity: .4; cursor: default; }
  .collect-btn .icon { width: 16px; height: 16px; }
  .upgrade-box { background: var(--paneldeep-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .upgrade-box .ub-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .upgrade-box .ub-head b { font-size: 13px; font-weight: 700; }
  .upgrade-box .ub-head .arrow { font-size: 12px; color: var(--inksoft-color); }
  .cost-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cost-chip { display: flex; align-items: center; gap: 5px; background: var(--panel-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600; }
  .cost-chip .icon { width: 13px; height: 13px; color: var(--accent-color); }
  .cost-chip.insufficient { color: #e0655a; border-color: #e0655a; }
  .cost-chip.insufficient .icon { color: #e0655a; }
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .action-btn { flex: 1; min-width: 120px; padding: 12px 14px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .action-btn .icon { width: 14px; height: 14px; }
  .action-btn.primary { background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); color: #fff; }
  .action-btn.primary:disabled { opacity: .4; cursor: default; }
  .action-btn.secondary { background: var(--paneldeep-color); color: var(--ink-color); border: 1px solid var(--border-color); }

  /* ===== CHAT ===== */
  .chat-overlay { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .chat-overlay.open { opacity: 1; pointer-events: auto; }
  .chat-panel { width: 100%; max-width: 480px; height: 82vh; background: var(--panel-color); color: var(--ink-color); border-radius: 18px 18px 0 0; border: 1px solid var(--border-color); display: flex; flex-direction: column; transform: translateY(20px); transition: transform .25s; }
  .chat-overlay.open .chat-panel { transform: translateY(0); }
  .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border-color); }
  .chat-head-info { display: flex; align-items: center; gap: 10px; }
  .chat-head-avatar { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); display: flex; align-items: center; justify-content: center; color: #fff; }
  .chat-head-avatar .icon { width: 16px; height: 16px; }
  .chat-head-text b { display: block; font-size: 14px; font-weight: 700; }
  .chat-head-text span { font-size: 11px; color: var(--inksoft-color); display: flex; align-items: center; gap: 4px; }
  .online-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf6d; display: inline-block; }
  .chat-tabs { display: flex; gap: 6px; padding: 10px 14px 0; }
  .chat-tab { padding: 6px 13px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--paneldeep-color); color: var(--inksoft-color); border: 1px solid var(--border-color); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chat-tab .icon { width: 12px; height: 12px; }
  .chat-tab.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
  .chat-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .sys-msg { text-align: center; font-size: 11.5px; color: var(--inksoft-color); background: var(--paneldeep-color); border-radius: 999px; padding: 5px 12px; margin: 6px auto; display: inline-flex; align-self: center; gap: 6px; align-items: center; }
  .sys-msg .icon { width: 11px; height: 11px; color: var(--accent-color); }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; margin: 5px 0; }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-avatar { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; background: var(--paneldeep-color); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--inksoft-color); }
  .msg-col { display: flex; flex-direction: column; max-width: 72%; gap: 3px; }
  .msg-row.me .msg-col { align-items: flex-end; }
  .msg-name { font-size: 10.5px; color: var(--inksoft-color); font-weight: 600; padding: 0 3px; }
  .msg-bubble { padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; background: var(--paneldeep-color); border: 1px solid var(--border-color); }
  .msg-row.me .msg-bubble { background: linear-gradient(155deg, var(--accent-color), var(--accent2-color)); color: #fff; border: none; }
  .msg-bubble.fa, .chat-input-row input.fa { font-family: 'Vazirmatn', 'Inter', sans-serif; direction: rtl; text-align: right; }
  .msg-time { font-size: 9.5px; color: var(--inksoft-color); padding: 0 3px; }
  .typing-row { display: flex; align-items: center; padding: 2px 0 2px 34px; }
  .typing-dots { display: flex; gap: 3px; background: var(--paneldeep-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 14px; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--inksoft-color); animation: typingBounce 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }

    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);

      osc.start(t); osc.stop(t + 0.25);

  }

    if (!this.enabled) return;
    this._init(); if (!this.ctx) return;

      osc.connect(g); g.connect(this.ctx.destination);

  }

  }

  return e("div", { className: "overlay open", onClick: (ev) => { if (ev.target === ev.currentTarget) onClose(); } },
    e("div", { className: "sheet" },
      e("div", { className: "sheet-head" },
        e("div", { className: "sheet-title" }, e("div", { className: "icon-wrap" }, Icon("trophy")),
          e("div", null, e("h2", null, "Civilization Rankings"), e("div", { className: "level-row" }, e("span", { className: "level-pill" }, "Global Power")))),
        e("button", { className: "close-btn", onClick: onClose }, Icon("close"))),
      e("div", { style: { marginTop: "14px", display: "flex", flexDirection: "column", gap: "8px" } },
        ranks.map((r, i) => e("div", { key: r.id, className: "prod-row", style: { border: r.id === culture ? "1.5px solid var(--highlight-color)" : "1px solid var(--border-color)" } },
          e("div", { className: "prod-info" }, e("b", { style: { width: "20px" } }, "#" + (i+1)), r.name),
          e("div", { className: "prod-amount" }, fmt(r.power) + " Power")))),
      e("div", { className: "action-row", style: { marginTop: "16px" } }, e("button", { className: "action-btn secondary", onClick: onClose }, "Close"))
    ));
}

function MenuSheet({ open, onClose, soundEnabled, onToggleSound, username, saveState, onLogout }) {

// ==========================================
// WORLD MAP  (Phaser scene + React overlay)
// ==========================================
// The map itself (terrain streaming, mountains/trees, castles, camera, input)
// is a Phaser scene. React only draws what sits on top of it: radar, zoom
// buttons, territory label and the "dispatch scout" popup.
//
// Files used (served by Vite from public/):
//   /map.json, /terrain/*, /objects/*, /minimap.png   <- written by "Bake map"
//   /assets/objects/castles/<civ>.png                 <- castle images (see CASTLE_ASSET_BASE)

const MAP_BASE_URL = '/';                              // folder that contains map.json
const CASTLE_ASSET_BASE = '/assets/objects/castles/';  // public/assets/objects/castles/
const MIN_ZOOM = 0.08;
const MAX_ZOOM = 1.4;

// runtime/civilizations.js ids  ->  culture keys used in this file
const CIV_TO_CULTURE = { persia: 'persian', mongol: 'mongol', arab: 'arabian', japan: 'japanese', rome: 'roman', viking: 'viking' };
const CULTURE_TO_CIV = Object.fromEntries(Object.entries(CIV_TO_CULTURE).map(([k, v]) => [v, k]));
const cssHex = (n) => '#' + n.toString(16).padStart(6, '0');

class WorldScene extends Phaser.Scene {
  constructor(bridge) {
    super('world');
    this.bridge = bridge;                              // React <-> Phaser callbacks
    this.map = null;                                   // BakedMap (after loading)
    this.session = null;                               // { player, npcs, layer, civ } (after the join screen)
    this.focus = { x: 0, y: 19200, zoom: 0.18 };       // what the camera shows now
    this.goal = { x: 0, y: 19200, zoom: 0.18 };        // where it is moving to (smoothed)
    this.marker = null;                                // tapped spot on the terrain
    this._drag = null;
    this._viewT = 0;
  }

  preload() {
    // Whole-world picture drawn under the streamed tiles (cheap far-zoom view).
    this.load.image('world_minimap', '/minimap.png');
  }

  create() {
    const cam = this.cameras.main;
    cam.setBackgroundColor('#060a0f');
    cam.setZoom(this.focus.zoom);
    cam.centerOn(this.focus.x, this.focus.y);

    this.overlay = this.add.graphics().setDepth(200000); // marches + target marker
    this._bindInput();

    this._boot().catch((err) => {
      console.error('[WorldScene] could not start the world:', err);
      this.bridge.onError(err);
    });
  }

  async _boot() {
    // 1. the baked map (terrain streaming + objects)
    this.map = await BakedMap.create(this, MAP_BASE_URL);
    const t = this.map.manifest.terrain;
    if (this.textures.exists('world_minimap')) {
      this.add.image(t.origin.x, t.origin.y, 'world_minimap')
        .setOrigin(0, 0)
        .setDisplaySize(t.worldSize.width, t.worldSize.height)
        .setDepth(-10);
    }
    this.bridge.onMapReady();

    // 1b. provinces of the outer band: faint outlines, central buildings, names.
    //     Must come BEFORE the castle session (it blocks the ground under the capitals).
    try {
      this.provinces = await createProvinceLayer(this, this.map, { assetBase: '/assets/provinces/' });
    } catch (err) {
      console.warn('[WorldScene] provinces could not be created:', err);
    }

    // 2. the runtime: the logged-in account's castle + the other castles, live from the server.
    //    The civilization was chosen once at the first login (see Root); the server's choice wins.
    //    There is NO offline mode: progress is saved on the server, so the game needs it.
    this.session = await startOnlineSession(this, this.map, {
      ui: false, centerCamera: false, assetBase: CASTLE_ASSET_BASE,
      civId: this.bridge.getCivId(),
      onNotice: (m) => this.bridge.onNotice(m),
      onAuthLost: () => this.bridge.onAuthLost(),
    });

    this.session.layer.events.on('select', (castle) => {
      this.session.layer.setSelected(castle.id);
      this.bridge.onCastleSelect(castle);
    });

    // NPC camps: tap one to open the attack sheet
    this.session.campLayer.events.on('select', (camp) => {
      this.session.layer.setSelected(null);
      this.session.campLayer.setSelected(camp.id);
      this.bridge.onCampSelect(camp, { rules: this.session.rules, home: this.session.player });
    });
    this.session.layer.events.on('select', () => this.session.campLayer.setSelected(null));

    // 3. look at the player's castle
    const p = this.session.player;
    const startZoom = Math.min(0.8, Math.max(0.45, window.innerWidth / 1100));
    this.flyTo(p.worldX, p.worldY - 120, startZoom, true);
    this.bridge.onJoin(this.session);
  }

  // ---- camera API (called from React) -------------------------------------

  flyTo(x, y, zoom, instant = false) {
    this.goal.x = x;
    this.goal.y = y;
    if (zoom != null) this.goal.zoom = Phaser.Math.Clamp(zoom, MIN_ZOOM, MAX_ZOOM);
    if (instant) Object.assign(this.focus, this.goal);
  }

  zoomBy(factor) {
    this.goal.zoom = Phaser.Math.Clamp(this.goal.zoom * factor, MIN_ZOOM, MAX_ZOOM);
  }

  clearMarker() {
    this.marker = null;
  }

  // ---- input ----------------------------------------------------------------

  _bindInput() {
    const input = this.input;

    input.on('pointerdown', (pointer) => {
      this._drag = { px: pointer.x, py: pointer.y, gx: this.focus.x, gy: this.focus.y, zoom: this.cameras.main.zoom };
      this.goal.x = this.focus.x;
      this.goal.y = this.focus.y;
    });

    input.on('pointermove', (pointer) => {
      if (!this._drag || !pointer.isDown) return;
      const d = this._drag;
      this.goal.x = d.gx - (pointer.x - d.px) / d.zoom;
      this.goal.y = d.gy - (pointer.y - d.py) / d.zoom;
    });

    input.on('pointerup', (pointer, over) => {
      this._drag = null;
      if (over && over.length) return;                 // a castle was clicked, not the ground
      if (pointer.getDistance() >= 6) return;          // it was a drag, not a tap
      const wp = this.cameras.main.getWorldPoint(pointer.x, pointer.y);
      this.marker = { x: wp.x, y: wp.y };
      this.bridge.onTerrainTap({ screenX: pointer.x, screenY: pointer.y, worldX: wp.x, worldY: wp.y });
    });

    input.on('wheel', (pointer, over, dx, dy) => this.zoomBy(dy < 0 ? 1.2 : 0.82));
  }

  // ---- per frame ------------------------------------------------------------

  update(time, delta) {
    const cam = this.cameras.main;

    // Smooth camera (same feel as the old 0.1 lerp, but independent of frame rate).
    const k = Math.min(1, 1 - Math.pow(0.9, delta / 16.667));
    this.focus.x += (this.goal.x - this.focus.x) * k;
    this.focus.y += (this.goal.y - this.focus.y) * k;
    this.focus.zoom += (this.goal.zoom - this.focus.zoom) * k;
    cam.setZoom(this.focus.zoom);
    cam.centerOn(this.focus.x, this.focus.y);

    if (this.map) this.map.update();                   // streams terrain tiles in/out
    this._drawOverlay();
    this._reportView(time);
  }

  _dashed(g, x1, y1, x2, y2, dash) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 1) return;
    const n = Math.ceil(len / (dash * 2));
    if (n > 300) { g.lineBetween(x1, y1, x2, y2); return; }
    const ux = (x2 - x1) / len;
    const uy = (y2 - y1) / len;
    for (let i = 0; i < n; i++) {
      const a = i * dash * 2;
      const b = Math.min(a + dash, len);
      g.lineBetween(x1 + ux * a, y1 + uy * a, x1 + ux * b, y1 + uy * b);
    }
  }

  // Marches and the target marker. Sizes are divided by zoom so they keep the
  // same size on screen at every zoom level.
  _drawOverlay() {
    const g = this.overlay;
    const z = this.focus.zoom;
    g.clear();

    for (const m of this.bridge.getMarches()) {
      g.lineStyle(2 / z, 0xf0c95a, 0.7);
      this._dashed(g, m.originX, m.originY, m.x, m.y, 4 / z);
      g.fillStyle(0xf0c95a, 1);
      g.fillCircle(m.x, m.y, 7 / z);
      g.fillStyle(0x0a0d14, 1);
      g.fillCircle(m.x, m.y, 4 / z);
    }

    // Armies sent against NPC camps (positions are calculated from the server's times)
    const ex = this.bridge.getExpeditions();
    for (const e of ex.list) {
      const t = Date.now() + ex.offset;
      const a = this.map.tileToWorld(e.from.tileX, e.from.tileY);
      const b = this.map.tileToWorld(e.to.tileX, e.to.tileY);
      const oneWay = Math.max(1, e.returnAt - e.arriveAt);
      const out = t < e.arriveAt;
      const f = Phaser.Math.Clamp(out ? 1 - (e.arriveAt - t) / oneWay : (t - e.arriveAt) / oneWay, 0, 1);
      const p = out ? { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f } : { x: b.x + (a.x - b.x) * f, y: b.y + (a.y - b.y) * f };
      const color = out ? 0xe8574a : (e.report && e.report.win ? 0x7bd88f : 0xb0b6c0);
      g.lineStyle(2 / z, color, 0.7);
      this._dashed(g, a.x, a.y, b.x, b.y, 4 / z);
      g.fillStyle(color, 1);
      g.fillCircle(p.x, p.y, 8 / z);
      g.fillStyle(0x0a0d14, 1);
      g.fillCircle(p.x, p.y, 4 / z);
    }

    if (this.marker) {
      const { x, y } = this.marker;
      g.lineStyle(2.5 / z, 0xf0c95a, 1);
      g.strokeCircle(x, y, 12 / z);
      g.lineBetween(x - 18 / z, y, x + 18 / z, y);
      g.lineBetween(x, y - 18 / z, x, y + 18 / z);
    }
  }

  // Tells React which tile / territory is in the middle of the screen (4x per second).
  _reportView(time) {
    if (!this.map || time - this._viewT < 250) return;
    this._viewT = time;
    const tile = this.map.worldToTile(this.focus.x, this.focus.y);
    const tx = Math.round(tile.x);
    const ty = Math.round(tile.y);
    this.bridge.onView({ tileX: tx, tileY: ty, territory: this.map.territoryAt(tx, ty) });
  }
}

function WorldMapView({ active, culture, onJoin, onCastleSelect, onCampSelect, onOpenCity, onNotice, onAuthLost, marches, onAddMarch, expeds, expOffset }) {
  const hostRef = useRef(null);
  const radarRef = useRef(null);
  const gameRef = useRef(null);
  const sceneRef = useRef(null);
  const sleptRef = useRef(false);
  const marchesRef = useRef(marches);
  const activeRef = useRef(active);
  const cbRef = useRef({});
  const lastCultureRef = useRef(culture);

  const [mapReady, setMapReady] = useState(false);
  const [error, setError] = useState("");
  const [view, setView] = useState({ tileX: 0, tileY: 0, territory: 255 });
  const [actionPop, setActionPop] = useState(null);
  const [online, setOnline] = useState(false);
  const showFps = useRef(new URLSearchParams(window.location.search).has('fps')).current; // add ?fps to the address
  const [fps, setFps] = useState("");

  // Always-fresh copies for the Phaser side (which is created only once).
  marchesRef.current = marches;
  const expRef = useRef({ list: [], offset: 0 });
  expRef.current = { list: expeds || [], offset: expOffset || 0 };
  activeRef.current = active;
  cbRef.current = { onJoin, onCastleSelect, onCampSelect, onOpenCity, onNotice, onAuthLost };

  // Create the Phaser game once; destroy it when the component goes away.
  useEffect(() => {
    const bridge = {
      getMarches: () => marchesRef.current,
      getExpeditions: () => expRef.current,
      onCampSelect: (camp, extra) => { sound.playClick(); cbRef.current.onCampSelect(camp, extra); },
      getCivId: () => CULTURE_TO_CIV[lastCultureRef.current],
      onAuthLost: () => { if (cbRef.current.onAuthLost) cbRef.current.onAuthLost(); },
      onMapReady: () => setMapReady(true),
      onError: (err) => setError(String((err && err.message) || err)),
      onView: (v) => setView((p) => (p.tileX === v.tileX && p.tileY === v.tileY && p.territory === v.territory ? p : v)),
      onTerrainTap: (tap) => { setActionPop(tap); sound.playClick(); },
      onJoin: (session) => {
        const c = CIV_TO_CULTURE[session.civ.id];
        if (c) {
          lastCultureRef.current = c;      // the camera is already on the castle: don't fly to the capital
          cbRef.current.onJoin(c, session.player, !!session.online);
        }
        setOnline(!!session.online);
      },
      onNotice: (msg) => { if (cbRef.current.onNotice) cbRef.current.onNotice(msg); },
      onCastleSelect: (castle) => {
        sound.playClick();
        if (castle.isPlayer) {
          const sc = sceneRef.current, cam = sc && sc.cameras.main;
          const origin = cam ? { x: (castle.worldX - cam.worldView.x) * cam.zoom, y: (castle.worldY - cam.worldView.y) * cam.zoom } : undefined;
          cbRef.current.onOpenCity(origin);
        }
        else cbRef.current.onCastleSelect(castle);
      },
    };

    const scene = new WorldScene(bridge);
    const game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: hostRef.current,
      backgroundColor: '#060a0f',
      scale: { mode: Phaser.Scale.RESIZE, width: '100%', height: '100%' },
      render: { antialias: true, antialiasGL: false, pixelArt: false }, // antialiasGL:false = no MSAA, lighter on the GPU
      scene: [scene],
    });
    sceneRef.current = scene;
    gameRef.current = game;

    // The stage can change size without a window resize (HUD wraps, rotation...).
    const ro = new ResizeObserver(() => game.scale.refresh());
    ro.observe(hostRef.current);

    return () => {
      ro.disconnect();
      if (scene.session && scene.session.close) scene.session.close();
      game.destroy(true);
      gameRef.current = null;
      sceneRef.current = null;
    };
  }, []);

  // Hidden (City view) -> stop rendering to save battery; visible again -> resume.
  useEffect(() => {
    const game = gameRef.current;
    if (!game) return;
    if (!active) {
      game.loop.sleep();
      sleptRef.current = true;
    } else if (sleptRef.current) {
      sleptRef.current = false;
      game.loop.wake();
      game.scale.refresh();
    }
  }, [active]);

  // Optional frame-rate readout (open the game with ?fps in the address).
  useEffect(() => {
    if (!showFps) return;
    const iv = setInterval(() => {
      const gm = gameRef.current;
      const sc = sceneRef.current;
      if (gm && sc) setFps("fps " + Math.round(gm.loop.actualFps) + " · objects drawn " + (sc.map ? sc.map.visibleObjectCount() : 0));
    }, 500);
    return () => clearInterval(iv);
  }, []);

  // Culture tab changed by the player -> fly to that territory.
  useEffect(() => {
    if (culture === lastCultureRef.current) return;
    lastCultureRef.current = culture;
    const scene = sceneRef.current;
    const cap = CAPITALS[culture];
    if (!scene || !cap) return;
    scene.flyTo(cap.x, cap.y, 0.32);
    if (activeRef.current) sound.playFly();
  }, [culture]);

  // Radar (10 fps): minimap image + camera rectangle + castle dots.
  useEffect(() => {
    if (!active || !mapReady) return;
    const mini = new Image();
    mini.src = '/minimap.png';
    let raf = 0;
    let last = 0;
    const draw = (ts) => {
      raf = requestAnimationFrame(draw);
      if (ts - last < 100) return;
      last = ts;
      const scene = sceneRef.current;
      const radar = radarRef.current;
      if (!scene || !scene.map || !radar) return;
      const ctx = radar.getContext('2d');
      const rw = radar.clientWidth;
      const rh = radar.clientHeight;
      if (radar.width !== rw) radar.width = rw;
      if (radar.height !== rh) radar.height = rh;
      ctx.clearRect(0, 0, rw, rh);

      const t = scene.map.manifest.terrain;
      const W = t.worldSize.width;
      const H = t.worldSize.height;
      if (mini.complete && mini.naturalWidth > 0) ctx.drawImage(mini, 0, 0, rw, rh);

      // Castles
      if (scene.session) {
        for (const c of scene.session.layer.getCastles()) {
          const civ = civById(c.civId);
          const cx = ((c.worldX - t.origin.x) / W) * rw;
          const cy = ((c.worldY - t.origin.y) / H) * rh;
          ctx.fillStyle = c.isPlayer ? '#ffd34d' : cssHex(civ ? civ.color : 0xffffff);
          ctx.beginPath();
          ctx.arc(cx, cy, c.isPlayer ? 4 : 2.5, 0, Math.PI * 2);
          ctx.fill();
          if (c.isPlayer) { ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke(); }
        }
      }

      // NPC camps (red squares)
      if (scene.session && scene.session.campLayer) {
        ctx.fillStyle = '#e8574a';
        for (const c of scene.session.campLayer.getCamps()) {
          const cx = ((c.worldX - t.origin.x) / W) * rw;
          const cy = ((c.worldY - t.origin.y) / H) * rh;
          ctx.fillRect(cx - 2, cy - 2, 4, 4);
        }
      }

      // Camera rectangle
      const v = scene.cameras.main.worldView;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(((v.x - t.origin.x) / W) * rw, ((v.y - t.origin.y) / H) * rh, (v.width / W) * rw, (v.height / H) * rh);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [active, mapReady]);

  const zoomIn = () => { const s = sceneRef.current; if (s) s.zoomBy(1.3); sound.playClick(); };
  const zoomOut = () => { const s = sceneRef.current; if (s) s.zoomBy(0.75); sound.playClick(); };
  const resetCamera = () => {
    const s = sceneRef.current;
    if (!s) return;
    const p = s.session && s.session.player;
    if (p) s.flyTo(p.worldX, p.worldY - 120, 0.45);
    else if (CAPITALS[culture]) s.flyTo(CAPITALS[culture].x, CAPITALS[culture].y, 0.28);
    sound.playFly();
  };

  // Minimap click teleport
  const handleRadarClick = (ev) => {
    const s = sceneRef.current;
    if (!s || !s.map) return;
    const rect = radarRef.current.getBoundingClientRect();
    const t = s.map.manifest.terrain;
    s.flyTo(
      t.origin.x + ((ev.clientX - rect.left) / rect.width) * t.worldSize.width,
      t.origin.y + ((ev.clientY - rect.top) / rect.height) * t.worldSize.height
    );
    sound.playFly();
  };

  // Map tile under a tap (world pixels are meaningless to players).
  const tapTile = (pop) => {
    const m = sceneRef.current && sceneRef.current.map;
    return m ? m.worldToTile(pop.worldX, pop.worldY) : { x: 0, y: 0 };
  };

  // Scouts leave from the player's castle (or the culture's capital before joining).
  const dispatchScout = () => {
    if (!actionPop) return;
    const s = sceneRef.current;
    const p = s && s.session && s.session.player;
    const cap = CAPITALS[culture];
    const ox = p ? p.worldX : cap.x;
    const oy = p ? p.worldY : cap.y;
    onAddMarch({
      id: Date.now(),
      title: "Scout to (" + Math.round(tapTile(actionPop).x) + ", " + Math.round(tapTile(actionPop).y) + ")",
      originX: ox,
      originY: oy,
      x: ox,
      y: oy,
      targetX: actionPop.worldX,
      targetY: actionPop.worldY,
      speed: 300,
      timeLeft: 12
    });
    setActionPop(null);
    if (s) s.clearMarker();
    sound.playUpgrade();
  };

  const terr = view.territory === 255 ? null : civByTerritory(view.territory);

  return e("div", { className: "world-map-wrap", style: active ? undefined : { visibility: "hidden", pointerEvents: "none" } },
    e("div", { className: "phaser-host", ref: hostRef }),

    !mapReady && !error && e("div", { className: "world-loading" }, "Loading baked isometric world & objects..."),
    error && e("div", { className: "world-loading", style: { color: "#f08a8a" } }, "Couldn't start the world: " + error),

    // Minimap Radar
    e("div", { className: "minimap-radar", onClick: handleRadarClick },
      e("canvas", { ref: radarRef }),
      e("div", { className: "minimap-label" }, "WORLD RADAR")),

    // World Map Controls
    e("div", { className: "world-controls" },
      e("button", { className: "world-btn", onClick: zoomIn, "aria-label": "Zoom in" }, Icon("plus")),
      e("button", { className: "world-btn", onClick: zoomOut, "aria-label": "Zoom out" }, Icon("minus")),
      e("button", { className: "world-btn", onClick: resetCamera, "aria-label": "Center my castle" }, Icon("locate"))),

    // Territory Info HUD (territory under the middle of the screen)
    e("div", { className: "territory-hud" },
      e("span", { className: "territory-dot", style: { background: terr ? cssHex(terr.color) : "#8a94a3" } }),
      terr ? terr.name : "Neutral Territory",
      e("span", { style: { opacity: 0.6 } }, "· Tile: " + view.tileX + ", " + view.tileY),
      online && e("span", { style: { color: "#6fe3a1", fontWeight: 700 } }, "· ONLINE")),

    showFps && e("div", { style: { position: "absolute", left: 6, top: 6, zIndex: 5, padding: "2px 6px", background: "rgba(0,0,0,.65)", color: "#7cfc9a", font: "12px monospace", pointerEvents: "none" } }, fps),

    // Action popup on map click
    actionPop && e("div", { className: "action-target-pop", style: { left: actionPop.screenX + "px", top: actionPop.screenY + "px" } },
      e("b", null, "Uncharted Terrain"),
      e("span", { className: "coord" }, "Tile " + Math.round(tapTile(actionPop).x) + ", " + Math.round(tapTile(actionPop).y)),
      e("button", { className: "march-btn", onClick: dispatchScout }, Icon("sword"), "Dispatch Scout"),
      e("button", { className: "action-btn secondary", style: { padding: "4px", fontSize: "10px" }, onClick: () => { setActionPop(null); if (sceneRef.current) sceneRef.current.clearMarker(); } }, "Cancel"))
  );
}

// ==========================================
// ROOT APP COMPONENT
// ==========================================
function App({ account, onLogout, onAuthLost }) {
  // The civilization is chosen once at the first login and never changes (server-side rule too).
  const culture = account.save.culture;
  const [viewMode, setViewMode] = useState("world"); // "city" or "world"
  const [selectedId, setSelectedId] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);
  const [storageOpen, setStorageOpen] = useState(false);
  const [battleOpen, setBattleOpen] = useState(false);
  const [ranksOpen, setRanksOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(() => !(account.save.settings && account.save.settings.sound === false));
  const [toast, setToast] = useState("");
  const [hintVisible, setHintVisible] = useState(true);
  const [pops, setPops] = useState([]);
  const [mapH, setMapH] = useState(600);
  const [marches, setMarches] = useState(() => account.save.marches || []);

  const toastTimer = useRef(null), scrollerRef = useRef(null), stageRef = useRef(null), popId = useRef(0);

  // Buildings, resources and army start from what the SERVER saved for this account
  // (first time ever: the starting values). Nothing is kept in the browser anymore.
  const [bByC, setBByC] = useState(() => {
    const m = {};
    const initData = window.__BUILDINGS__ || {};
    CULTURE_ORDER.forEach((c) => {
      m[c] = (initData[c] || []).map((b) => ({ ...b, stored: 0, readyAt: 0 }));
    });
    const saved = account.save.buildings && account.save.buildings[culture];
    if (saved && saved.length) {
      const byId = new Map(saved.map((b) => [b.id, b]));
      // saved progress (level, stored ...) on top of the current building list
      m[culture] = m[culture].length ? m[culture].map((d) => (byId.has(d.id) ? { ...d, ...byId.get(d.id) } : d)) : saved;
    }
    return m;
  });

  const [rByC, setRByC] = useState(() => {
    const m = {};
    CULTURE_ORDER.forEach((c) => { m[c] = { food: 120, wood: 150, stone: 100, iron: 50, coin: 250 }; });
    const saved = account.save.resources && account.save.resources[culture];
    if (saved) m[culture] = { ...m[culture], ...saved };
    return m;
  });

  // Troops: { troops: {culture: {troopId: count}}, queue: {culture: [{id, troopId, count, endsAt}]} }
  const [army, setArmy] = useState(() => {
    const a = account.save.army;
    return a && a.troops && a.queue ? { troops: a.troops, queue: a.queue } : { troops: {}, queue: {} };
  });
  // Finish batches whose time is up (also catches batches that finished while the game was closed).
  useEffect(() => {
    const iv = setInterval(() => {
      setArmy((prev) => {
        const now = Date.now();
        let changed = false;
        const troops = { ...prev.troops }, queue = { ...prev.queue };
        for (const c of Object.keys(queue)) {
          const done = queue[c].filter((j) => j.endsAt <= now);
          if (!done.length) continue;
          changed = true;
          const mine = { ...(troops[c] || {}) };
          for (const j of done) mine[j.troopId] = (mine[j.troopId] || 0) + j.count;
          troops[c] = mine;
          queue[c] = queue[c].filter((j) => j.endsAt > now);
        }
        return changed ? { troops, queue } : prev;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => { sound.enabled = soundEnabled; }, [soundEnabled]);

  const themes = window.__THEMES__ || {};
  const theme = themes[culture] || {
    name: "Persian", kingdomName: "The Persian Empire", panel: "#14233a", panelDeep: "#0d1a2b",
    ink: "#eef2f8", inkSoft: "#9bb0c8", accent: "#21879e", accent2: "#155f72", highlight: "#f0c95a",
    border: "#2a405c", plateBg1: "#f2ead4", plateBg2: "#e0d3b0", plateBorder: "#1f6f86",
    plateInk: "#1f2a3a", plateSub: "#8a6a1f", plateFont: "'Cinzel', serif", plateRadius: "2px",
    resourceNames: { food: "Grain", wood: "Timber", stone: "Stone", iron: "Iron" },
    labels: {}
  };

  const buildings = bByC[culture] || [];
  const resources = rByC[culture] || { food: 0, wood: 0, stone: 0, iron: 0, coin: 0 };
  const selected = buildings.find((b) => b.id === selectedId) || null;

  const vars = {
    "--panel-color": theme.panel, "--paneldeep-color": theme.panelDeep, "--ink-color": theme.ink, "--inksoft-color": theme.inkSoft,
    "--accent-color": theme.accent, "--accent2-color": theme.accent2, "--highlight-color": theme.highlight, "--border-color": theme.border,
    "--plate-bg1": theme.plateBg1, "--plate-bg2": theme.plateBg2, "--plate-border": theme.plateBorder, "--plate-ink": theme.plateInk,
    "--plate-sub": theme.plateSub, "--plate-font": theme.plateFont, "--plate-radius": theme.plateRadius
  };

  const showToast = useCallback((msg) => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  }, []);

  // ===== SAVE TO THE SERVER =====
  // Autosave every 30 s, shortly after important actions (collect / upgrade / train),
  // and when the tab is hidden or closed. The server rejects an old tab that would
  // overwrite newer progress (version check) -> the "opened elsewhere" screen below.
  const [saveState, setSaveState] = useState("saved"); // saved | saving | error
  const [conflict, setConflict] = useState(false);
  const snapRef = useRef(null);
  snapRef.current = { bByC, rByC, army, marches, soundEnabled };
  const verRef = useRef(account.save.version);
  const revRef = useRef(0);        // counts changes of the game state
  const savedRevRef = useRef(1);   // last change that reached the server (1 = the mount itself is not a change)
  const inflightRef = useRef(false);
  const againRef = useRef(false);
  const stoppedRef = useRef(false);
  const flushedRef = useRef(false);
  const soonTimer = useRef(null);
  const errShownRef = useRef(false);

  useEffect(() => { revRef.current++; }, [bByC, rByC, army, marches, soundEnabled]);

  const buildSave = useCallback(() => {
    const s = snapRef.current, c = culture;
    return {
      buildings: { [c]: s.bByC[c] || [] },
      resources: { [c]: s.rByC[c] },
      army: { troops: { [c]: s.army.troops[c] || {} }, queue: { [c]: s.army.queue[c] || [] } },
      marches: s.marches,
      settings: { sound: s.soundEnabled },
    };
  }, [culture]);

  const saveNow = useCallback(async () => {
    if (stoppedRef.current) return;
    if (inflightRef.current) { againRef.current = true; return; }
    if (revRef.current === savedRevRef.current) return; // nothing new
    inflightRef.current = true;
    const myRev = revRef.current;
    setSaveState("saving");
    try {
      const res = await api.putSave(buildSave(), verRef.current);
      verRef.current = res.version;
      savedRevRef.current = myRev;
      errShownRef.current = false;
      setSaveState("saved");
    } catch (err) {
      if (err.status === 409 && err.data && err.data.code === "stale") { stoppedRef.current = true; setConflict(true); }
      else if (err.status === 401) { stoppedRef.current = true; onAuthLost(); }
      else {
        setSaveState("error");
        if (!errShownRef.current) { errShownRef.current = true; showToast("Cannot save right now - will keep trying"); }
      }
    } finally {
      inflightRef.current = false;
      if (againRef.current && !stoppedRef.current) { againRef.current = false; saveNow(); }
    }
  }, [buildSave, onAuthLost]);

  const saveSoon = useCallback(() => {
    clearTimeout(soonTimer.current);
    soonTimer.current = setTimeout(saveNow, 1500);
  }, [saveNow]);

  useEffect(() => {
    const iv = setInterval(saveNow, 30000);
    return () => clearInterval(iv);
  }, [saveNow]);

  useEffect(() => {
    // Tab hidden / page closing: send the save in a request that survives the page.
    const flush = () => {
      if (stoppedRef.current || inflightRef.current || revRef.current === savedRevRef.current) return;
      flushedRef.current = true;
      api.flushSave({ ...buildSave(), baseVersion: verRef.current });
    };
    // Back on the tab: find out whether that flush reached the server (it changes the version by +1).
    const reconcile = async () => {
      if (!flushedRef.current || stoppedRef.current) return;
      flushedRef.current = false;
      try {
        const { save } = await api.getSave();
        if (save.version === verRef.current + 1) { verRef.current = save.version; savedRevRef.current = revRef.current; }
        else if (save.version !== verRef.current) { stoppedRef.current = true; setConflict(true); }
      } catch (err) { if (err.status === 401) onAuthLost(); }
    };
    const onVis = () => (document.visibilityState === "hidden" ? flush() : reconcile());
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", flush);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("pagehide", flush); };
  }, [buildSave, onAuthLost]);

  const logout = async () => {
    clearTimeout(soonTimer.current);
    await saveNow();
    for (let i = 0; i < 30 && inflightRef.current; i++) await new Promise((r) => setTimeout(r, 100));
    stoppedRef.current = true;
    onLogout();
  };

  // ===== NPC CAMPS: attacks are decided by the SERVER =====
  // The game saves first, then asks the server; the server takes the troops from the saved army and later
  // hands back survivors + loot. We adopt what it answers (troops, resources, version).
  const [expeds, setExpeds] = useState([]);
  const expOffsetRef = useRef(0);               // serverNow - Date.now()
  const [expOffset, setExpOffset] = useState(0);
  const [campSel, setCampSel] = useState(null); // { camp, home, rules }
  const [reports, setReports] = useState(null);
  const expBusyRef = useRef(false);
  const lastFetchRef = useRef(0);
  const serverNow = useCallback(() => Date.now() + expOffsetRef.current, []);
  const syncClock = (now) => { if (now) { expOffsetRef.current = now - Date.now(); setExpOffset(expOffsetRef.current); } };

  const flushSaved = useCallback(async () => {
    for (let i = 0; i < 50; i++) {
      if (stoppedRef.current) return false;
      if (!inflightRef.current && revRef.current === savedRevRef.current) return true;
      if (!inflightRef.current) await saveNow(); else await new Promise((r) => setTimeout(r, 100));
    }
    return false;
  }, [saveNow]);

  const adoptServer = useCallback((save) => {
    verRef.current = save.version;
    setArmy((prev) => ({ ...prev, troops: { ...prev.troops, [culture]: save.troops } }));
    if (save.resources) setRByC((prev) => ({ ...prev, [culture]: { ...(prev[culture] || {}), ...save.resources } }));
  }, [culture]);

  const handleApiError = useCallback((err) => {
    if (err.status === 401) { stoppedRef.current = true; onAuthLost(); }
    else if (err.status === 409 && err.data && err.data.code === "stale") { stoppedRef.current = true; setConflict(true); }
    else showToast(err.message || "Something went wrong");
  }, [onAuthLost, showToast]);

  const refreshExpeds = useCallback(async () => {
    lastFetchRef.current = Date.now();
    try { const r = await api.getExpeditions(); syncClock(r.now); setExpeds(r.expeditions); } catch (err) { if (err.status === 401) onAuthLost(); }
  }, [onAuthLost]);

  const claimHome = useCallback(async () => {
    if (expBusyRef.current || stoppedRef.current) return;
    expBusyRef.current = true;
    try {
      if (!(await flushSaved())) return;
      const r = await api.claimExpeditions(verRef.current);
      syncClock(r.now);
      if (r.reports.length) {
        adoptServer(r.save);
        setReports(r.reports);
        const won = r.reports.filter((x) => x.win).length;
        showToast(won ? "Victory! Loot has been added to your storage" : "Your army is back");
        await refreshExpeds();
      }
    } catch (err) { handleApiError(err); } finally { expBusyRef.current = false; }
  }, [flushSaved, adoptServer, showToast, refreshExpeds, handleApiError]);

  const attackCamp = useCallback(async (camp, troops) => {
    if (expBusyRef.current) return false;
    expBusyRef.current = true;
    try {
      if (!(await flushSaved())) { showToast("Saving… try again in a moment"); return false; }
      const r = await api.attackCamp({ campId: camp.id, troops, baseVersion: verRef.current });
      syncClock(r.now);
      adoptServer(r.save);
      setExpeds((prev) => [...prev, r.expedition]);
      setCampSel(null);
      showToast("Army sent to " + camp.name);
      return true;
    } catch (err) { handleApiError(err); return false; } finally { expBusyRef.current = false; }
  }, [flushSaved, adoptServer, showToast, handleApiError]);

  useEffect(() => { refreshExpeds(); }, [refreshExpeds]);
  useEffect(() => {
    const onEvt = () => { refreshExpeds().then(claimHome); };
    window.addEventListener("kingdoms:expedition", onEvt);
    return () => window.removeEventListener("kingdoms:expedition", onEvt);
  }, [refreshExpeds, claimHome]);
  // 1 s: an army that is home is collected; one that has just arrived gets its report; slow fallback poll
  const [, setClockTick] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => {
      setClockTick((n) => n + 1);
      const t = serverNow();
      const list = expedsRef.current;
      if (list.some((x) => t >= x.returnAt + 500)) claimHome();
      else if (list.some((x) => t >= x.arriveAt + 1500 && !x.report) && Date.now() - lastFetchRef.current > 3000) refreshExpeds();
      else if (Date.now() - lastFetchRef.current > 30000) refreshExpeds();
    }, 1000);
    return () => clearInterval(iv);
  }, [serverNow, claimHome, refreshExpeds]);
  const expedsRef = useRef([]);
  expedsRef.current = expeds;

  // City image dimensions calculation
  useEffect(() => {
    const el = stageRef.current; if (!el) return;
    const update = () => setMapH(Math.max(el.clientHeight, el.clientWidth / (3174 / 1344)));
    update();
    const ro = new ResizeObserver(update); ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Production tick (1s) & Marches update
  useEffect(() => {
    const iv = setInterval(() => {
      // 1. Resources
      setBByC((prev) => {
        const next = { ...prev };
        [culture].forEach((c) => {
          next[c] = (next[c] || []).map((b) => {
            if (!b.produces) return b;
            const prev0 = b.stored || 0;
            const stored = Math.min(prev0 + productionRate(b.level), capacity(b.level));
            if (stored === prev0) return b;
            const readyAt = (prev0 < 1 && stored >= 1) ? Date.now() : (b.readyAt || 0);
            return { ...b, stored, readyAt };
          });
        });
        return next;
      });

      // 2. Marches
      setMarches((prev) => {
        return prev.map(m => {
          const timeLeft = m.timeLeft - 1;
          const progress = Math.min(1, 1 - (timeLeft / 12));
          const x = m.originX + (m.targetX - m.originX) * progress;
          const y = m.originY + (m.targetY - m.originY) * progress;
          return { ...m, x, y, timeLeft };
        }).filter(m => {
          if (m.timeLeft <= 0) {
            showToast("Scout expedition arrived at destination!");
            return false;
          }
          return true;
        });
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [showToast, culture]);

  const spawnPop = (id, text, icon) => {
    const pid = ++popId.current;
    setPops((p) => [...p, { id: pid, bid: id, text, icon }]);
    setTimeout(() => setPops((p) => p.filter((x) => x.id !== pid)), 950);
  };

  const collect = (building) => {
    const amount = Math.floor(building.stored || 0);
    if (amount < 1) return;
    sound.playCollect();
    setBByC((prev) => ({ ...prev, [culture]: prev[culture].map((b) => b.id === building.id ? { ...b, stored: 0, readyAt: 0 } : b) }));
    setRByC((prev) => ({ ...prev, [culture]: { ...prev[culture], [building.produces]: prev[culture][building.produces] + amount } }));
    spawnPop(building.id, "+" + fmt(amount), RES_ICON[building.produces]);
    showToast("+" + fmt(amount) + " " + theme.resourceNames[building.produces]);
    saveSoon();
  };

  const upgrade = (building, cost) => {
    sound.playUpgrade();
    setRByC((prev) => ({ ...prev, [culture]: { ...prev[culture], wood: prev[culture].wood - cost.wood, stone: prev[culture].stone - cost.stone, coin: prev[culture].coin - cost.coin } }));
    setBByC((prev) => ({ ...prev, [culture]: prev[culture].map((b) => b.id === building.id ? { ...b, level: b.level + 1 } : b) }));
    setSelectedId(null);
    showToast((theme.labels[building.id] || { name: building.id }).name + " → Level " + (building.level + 1));
    saveSoon();
  };

  const train = (troop, count, unitCost) => {
    sound.playUpgrade();
    setRByC((prev) => {
      const r = { ...prev[culture] };
      for (const [k, v] of Object.entries(unitCost)) r[k] = r[k] - v * count;
      return { ...prev, [culture]: r };
    });
    setArmy((prev) => {
      const q = prev.queue[culture] || [];
      const start = q.length ? q[q.length - 1].endsAt : Date.now();
      const job = { id: Date.now() + "_" + Math.random().toString(36).slice(2, 6), troopId: troop.id, count, endsAt: start + troopUnitTime(troop) * count * 1000 };
      return { ...prev, queue: { ...prev.queue, [culture]: [...q, job] } };
    });
    showToast("Training " + count + " × " + troop.name);
    saveSoon();
  };

  const toggleSound = () => {
    const next = !soundEnabled;
    sound.enabled = next;
    setSoundEnabled(next);
    showToast(next ? "Sound FX Enabled" : "Sound Muted");
  };

  // Animated switch between the World Map and the City (see runtime/ui/ViewTransition.js).
  const goView = (mode, origin) => {
    if (mode === viewMode) return;
    sound.playFly();
    switchView({
      stage: stageRef.current, from: viewMode, to: mode, origin,
      apply: (m) => ReactDOM.flushSync(() => setViewMode(m)),
    });
  };

  const now = Date.now();
  const resKeys = ["food", "wood", "stone", "iron"];

  return e("div", { style: { height: "100%", display: "flex", flexDirection: "column", ...vars } },
    // Top HUD
    e("div", { className: "hud-top" },
      e("div", { className: "hud-row1" },
        e("div", { className: "realm-crest" }, Icon("crown")),
        e("div", { className: "ledger" },
          resKeys.map((r) => e("div", { key: r, className: "ledger-cell" }, Icon(RES_ICON[r]), e("b", null, fmt(resources[r])))),
          e("div", { className: "ledger-cell coin" }, Icon("coin"), e("b", null, fmt(resources.coin)))),
        e("button", {
          className: "mode-switch-btn",
          onClick: () => {
            sound.playClick();
            goView(viewMode === "city" ? "world" : "city");
          }
        }, Icon(viewMode === "city" ? "map" : "hall"), viewMode === "city" ? "World Map" : "City Base"),
        e("button", { className: "menu-toggle", onClick: () => { sound.playClick(); setMenuOpen(true); }, "aria-label": "Menu" }, Icon("menu"))),
      
      // Own civilization only: it is chosen once and cannot be switched
      e("div", { className: "culture-row" },
        e("div", { className: "culture-tab active", style: { cursor: "default" } }, (themes[culture]?.name || culture) + " · " + account.user.username))),

    // Main Stage Area (Dual View)
    e("div", { className: "stage", ref: stageRef },
      // The world map stays mounted (hidden) while you are in the city, so the
      // castles and the map don't reload every time you switch views.
      e(WorldMapView, {
        active: viewMode === "world",
        culture,
        onJoin: (c, player) => { showToast("Welcome, " + player.name + "!"); },
        onNotice: showToast,
        onAuthLost,
        onCastleSelect: (castle) => showToast(castle.name + " · " + ((civById(castle.civId) || {}).name || castle.civId)),
        onCampSelect: (camp, extra) => setCampSel({ camp, home: extra.home, rules: extra.rules }),
        expeds, expOffset,
        onOpenCity: (origin) => goView("city", origin),
        marches,
        onAddMarch: (m) => setMarches((prev) => [...prev, m])
      }),
      viewMode === "city" &&
        e("div", { className: "city-container", ref: scrollerRef, onScroll: () => setHintVisible(false) },
          e("div", { className: "city-inner", style: { "--u": (mapH / 100) + "px", height: mapH + "px" } },
            e("img", { src: `./kingdom_art/${culture}.jpg`, alt: theme.kingdomName, draggable: false }),
            buildings.map((b) => e(Hotspot, {
              key: culture + "-" + b.id, b, theme,
              showCollect: !!b.produces && (b.stored || 0) >= 1 && (b.readyAt || 0) > 0 && (now - b.readyAt) < COLLECT_ICON_MS,
              active: selectedId === b.id,
              onSelect: (bb) => setSelectedId(bb.id),
              onCollect: collect
            })),
            pops.map((p) => {
              const b = buildings.find((x) => x.id === p.bid); if (!b) return null;
              return e("div", { key: p.id, className: "float-pop", style: { left: (b.x + b.w / 2) + "%", top: (b.y + b.h * 0.5) + "%" } }, Icon(p.icon), p.text);
            })),
          e("div", { className: "scroll-hint" + (hintVisible ? "" : " hide") }, Icon("drag"), "DRAG TO EXPLORE CITY"))
    ),

    // Bottom Navigation HUD
    e("div", { className: "hud-bottom" },
      e("button", { className: "nav-btn" + (viewMode === "city" ? " active" : ""), onClick: () => { sound.playClick(); goView("city"); } }, e("div", { className: "nic" }, Icon("hall")), e("span", null, "City")),
      e("button", { className: "nav-btn" + (viewMode === "world" ? " active" : ""), onClick: () => { sound.playClick(); goView("world"); } }, e("div", { className: "nic" }, Icon("map")), e("span", null, "World Map")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setBattleOpen(true); } },
        (marches.length + expeds.length) > 0 && e("span", { className: "badge" }, marches.length + expeds.length),
        e("div", { className: "nic" }, Icon("sword")), e("span", null, "Battle")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setStorageOpen(true); } }, e("div", { className: "nic" }, Icon("chest")), e("span", null, "Storage")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setChatOpen(true); } },
        e("span", { className: "badge" }, "3"),
        e("div", { className: "nic" }, Icon("chat")), e("span", null, "Chat")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setRanksOpen(true); } }, e("div", { className: "nic" }, Icon("trophy")), e("span", null, "Ranks"))),

    // Sheets & Overlays
    e(DetailSheet, { building: selected && selected.category !== "barracks" ? selected : null, theme, resources, onClose: () => setSelectedId(null), onCollect: collect, onUpgrade: upgrade }),
    e(BarracksSheet, { open: !!selected && selected.category === "barracks", building: selected, culture, theme, resources, army, onClose: () => setSelectedId(null), onTrain: train }),
    e(ChatPanel, { open: chatOpen, onClose: () => setChatOpen(false) }),
    e(StorageSheet, { open: storageOpen, onClose: () => setStorageOpen(false), resources, buildings, theme }),
    e(BattleSheet, { open: battleOpen, onClose: () => setBattleOpen(false), marches, onNewMarch: (m) => setMarches(p => [...p, m]), expeds, serverNow }),
    e(CampSheet, {
      camp: campSel && campSel.camp, home: campSel && campSel.home, rules: campSel && campSel.rules,
      troops: army.troops[culture] || {}, activeCount: expeds.length,
      onClose: () => setCampSel(null), onAttack: attackCamp
    }),
    e(ReportSheet, { reports, onClose: () => setReports(null) }),
    e(RankingsSheet, { open: ranksOpen, onClose: () => setRanksOpen(false), culture, buildingsByCulture: bByC }),
    e(MenuSheet, { open: menuOpen, onClose: () => setMenuOpen(false), soundEnabled, onToggleSound: toggleSound, username: account.user.username, saveState, onLogout: logout }),
    e("div", { className: "toast" + (toast ? " show" : "") }, toast),
    conflict && e("div", { className: "auth-screen", style: { position: "fixed", zIndex: 9999 } },
      e("div", { className: "auth-card" },
        e("h1", null, "Opened somewhere else"),
        e("p", { className: "auth-sub" }, "This account was saved from another tab or device. To keep your newest progress safe, this tab stopped saving."),
        e("button", { className: "auth-btn", onClick: () => location.reload() }, "Reload with latest progress")))
  );
}

// ==========================================
// LOGIN + START (Root)
// ==========================================
function AuthScreen({ onDone, notice }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(notice || "");

  const submit = async (ev) => {
    ev.preventDefault();
    if (busy) return;
    const username = name.trim();
    if (mode === "register") {
      if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) return setErr("Username: 3-16 letters, digits or _");
      if (pw.length < 8) return setErr("Password: at least 8 characters");
      if (pw !== pw2) return setErr("The two passwords are different");
    } else if (!username || !pw) return setErr("Enter your username and password");
    setBusy(true); setErr("");
    try {
      if (mode === "register") await api.register(username, pw, remember); else await api.login(username, pw, remember);
      onDone();
    } catch (error) {
      setErr(error.status === 0 ? "Cannot reach the game server" : error.message);
      setBusy(false);
    }
  };

  const field = (label, value, set, type, auto) => e("label", { className: "auth-field" }, label,
    e("input", { type, value, onChange: (ev) => set(ev.target.value), autoComplete: auto, spellCheck: false, autoCapitalize: "off", disabled: busy }));

  return e("div", { className: "auth-screen" },
    e("form", { className: "auth-card", onSubmit: submit },
      e("h1", null, "Kingdoms: Realm & World"),
      e("p", { className: "auth-sub" }, mode === "login" ? "Log in to continue your kingdom" : "Create an account to found your kingdom"),
      e("div", { className: "auth-tabs" },
        e("button", { type: "button", className: mode === "login" ? "on" : "", onClick: () => { setMode("login"); setErr(""); } }, "Log in"),
        e("button", { type: "button", className: mode === "register" ? "on" : "", onClick: () => { setMode("register"); setErr(""); } }, "Register")),
      field("Username", name, setName, "text", "username"),
      field("Password", pw, setPw, "password", mode === "login" ? "current-password" : "new-password"),
      mode === "register" && field("Repeat password", pw2, setPw2, "password", "new-password"),
      e("label", { className: "auth-check" }, e("input", { type: "checkbox", checked: remember, onChange: (ev) => setRemember(ev.target.checked), disabled: busy }), "Remember me on this device"),
      err && e("div", { className: "auth-err", role: "alert" }, err),
      e("button", { type: "submit", className: "auth-btn", disabled: busy }, busy ? "Please wait..." : mode === "login" ? "Log in" : "Create account")));
}

function Root() {
  const [phase, setPhase] = useState("boot"); // boot | down | login | game
  const [message, setMessage] = useState("");
  const [account, setAccount] = useState(null);

  const enter = useCallback(async (notice) => {
    setPhase("boot");
    try {
      if (!(await api.probeServer())) { setMessage("Cannot reach the game server. Start it (npm run server) and try again."); setPhase("down"); return; }
      if (!api.getToken()) { setMessage(notice || ""); setPhase("login"); return; }
      let me;
      try { me = await api.me(); }
      catch (err) { if (err.status === 401) { api.clearToken(); setMessage("Please log in again"); setPhase("login"); return; } throw err; }
      if (!me.culture) {
        // first login of this account: choose the civilization (ONCE - the server refuses any later change)
        const choice = await showJoinScreen({ assetBase: CASTLE_ASSET_BASE, fixedName: me.user.username });
        await api.join(choice.civId);
      }
      const { save } = await api.getSave();
      setAccount({ user: me.user, save });
      setPhase("game");
    } catch (err) {
      setMessage(err.status === 0 ? "Cannot reach the game server. Start it (npm run server) and try again." : "Could not start: " + err.message);
      setPhase("down");
    }
  }, []);

  useEffect(() => { enter(); }, [enter]);

  const logout = async () => { await api.logout(); location.reload(); };
  const authLost = useCallback(() => { api.clearToken(); location.reload(); }, []);

  if (phase === "game") return e(App, { account, onLogout: logout, onAuthLost: authLost });
  if (phase === "login") return e(AuthScreen, { onDone: () => enter(), notice: message });
  if (phase === "down") return e("div", { className: "auth-screen" }, e("div", { className: "auth-card" },
    e("h1", null, "Connection problem"), e("p", { className: "auth-sub" }, message),
    e("button", { className: "auth-btn", onClick: () => enter() }, "Try again")));
  return e("div", { style: { height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "#9fb3c2", font: "600 14px Inter,sans-serif" } }, "Loading kingdom & world...");
}

ReactDOM.createRoot(document.getElementById("root")).render(e(Root));
</script>
</body>
