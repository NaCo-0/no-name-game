function App({ account, onLogout, onAuthLost }) {
  // The civilization is chosen once at the first login and never changes (server-side rule too).
  const culture = account.save.culture;
  const [viewMode, setViewMode] = useState("world"); // "city" or "world"
  const [selectedId, setSelectedId] = useState(null);
  const [mailOpen, setMailOpen] = useState(false);
  const [mailTab, setMailTab] = useState("report");   // report | letter | chat
  const [mailFocus, setMailFocus] = useState(null);   // report to open straight away
  const [mailUnread, setMailUnread] = useState({ report: 0, letter: 0 });
  const [mailTick, setMailTick] = useState(0);        // bumps when a new letter/report arrives while the panel is open
  const [guideOpen, setGuideOpen] = useState(false);
  const [battleCfg, setBattleCfg] = useState(null);
  const [storageOpen, setStorageOpen] = useState(false);
  const [battleOpen, setBattleOpen] = useState(false);
  const [ranksOpen, setRanksOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [soundEnabled, setSoundEnabled] = useState(() => !(account.save.settings && account.save.settings.sound === false));
  const [toast, setToast] = useState("");
  const [hintVisible, setHintVisible] = useState(true);
  const [pops, setPops] = useState([]);
  const [mapH, setMapH] = useState(600);
  const [marches, setMarches] = useState(() => account.save.marches || []);

  const toastTimer = useRef(null), scrollerRef = useRef(null), stageRef = useRef(null), popId = useRef(0);

  // Buildings, resources and army start from what the SERVER saved for this account
  // (first time ever: the starting values). Nothing is kept in the browser anymore.
  const [bByC, setBByC] = useState(() => {
    const m = {};
    const initData = window.__BUILDINGS__ || {};
    CULTURE_ORDER.forEach((c) => {
      m[c] = (initData[c] || []).map((b) => ({ ...b, stored: 0, readyAt: 0 }));
    });
    const saved = account.save.buildings && account.save.buildings[culture];
    if (saved && saved.length) {
      const byId = new Map(saved.map((b) => [b.id, b]));
      // saved progress (level, stored ...) on top of the current building list
      m[culture] = m[culture].length ? m[culture].map((d) => (byId.has(d.id) ? { ...d, ...byId.get(d.id) } : d)) : saved;
    }
    return m;
  });

  const [rByC, setRByC] = useState(() => {
    const m = {};
    CULTURE_ORDER.forEach((c) => { m[c] = { food: 120, wood: 150, stone: 100, iron: 50, coin: 250 }; });
    const saved = account.save.resources && account.save.resources[culture];
    if (saved) m[culture] = { ...m[culture], ...saved };
    return m;
  });

  // Troops: { troops: {culture: {troopId: count}}, queue: {culture: [{id, troopId, count, endsAt}]} }
  const [army, setArmy] = useState(() => {
    const a = account.save.army;
    return a && a.troops && a.queue ? { troops: a.troops, queue: a.queue } : { troops: {}, queue: {} };
  });
  // Finish batches whose time is up (also catches batches that finished while the game was closed).
  useEffect(() => {
    const iv = setInterval(() => {
      setArmy((prev) => {
        const now = Date.now();
        let changed = false;
        const troops = { ...prev.troops }, queue = { ...prev.queue };
        for (const c of Object.keys(queue)) {
          const done = queue[c].filter((j) => j.endsAt <= now);
          if (!done.length) continue;
          changed = true;
          const mine = { ...(troops[c] || {}) };
          for (const j of done) mine[j.troopId] = (mine[j.troopId] || 0) + j.count;
          troops[c] = mine;
          queue[c] = queue[c].filter((j) => j.endsAt > now);
        }
        return changed ? { troops, queue } : prev;
      });
    }, 1000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => { sound.enabled = soundEnabled; }, [soundEnabled]);

  const themes = window.__THEMES__ || {};
  const theme = themes[culture] || {
    name: "Persian", kingdomName: "The Persian Empire", panel: "#14233a", panelDeep: "#0d1a2b",
    ink: "#eef2f8", inkSoft: "#9bb0c8", accent: "#21879e", accent2: "#155f72", highlight: "#f0c95a",
    border: "#2a405c", plateBg1: "#f2ead4", plateBg2: "#e0d3b0", plateBorder: "#1f6f86",
    plateInk: "#1f2a3a", plateSub: "#8a6a1f", plateFont: "'Cinzel', serif", plateRadius: "2px",
    resourceNames: { food: "Grain", wood: "Timber", stone: "Stone", iron: "Iron" },
    labels: {}
  };

  const buildings = bByC[culture] || [];
  const resources = rByC[culture] || { food: 0, wood: 0, stone: 0, iron: 0, coin: 0 };
  const selected = buildings.find((b) => b.id === selectedId) || null;

  const vars = {
    "--panel-color": theme.panel, "--paneldeep-color": theme.panelDeep, "--ink-color": theme.ink, "--inksoft-color": theme.inkSoft,
    "--accent-color": theme.accent, "--accent2-color": theme.accent2, "--highlight-color": theme.highlight, "--border-color": theme.border,
    "--plate-bg1": theme.plateBg1, "--plate-bg2": theme.plateBg2, "--plate-border": theme.plateBorder, "--plate-ink": theme.plateInk,
    "--plate-sub": theme.plateSub, "--plate-font": theme.plateFont, "--plate-radius": theme.plateRadius
  };

  const showToast = useCallback((msg) => {
    setToast(msg);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  }, []);

  // ===== SAVE TO THE SERVER =====
  // Autosave every 30 s, shortly after important actions (collect / upgrade / train),
  // and when the tab is hidden or closed. The server rejects an old tab that would
  // overwrite newer progress (version check) -> the "opened elsewhere" screen below.
  const [saveState, setSaveState] = useState("saved"); // saved | saving | error
  const [conflict, setConflict] = useState(false);
  const [conflictMsg, setConflictMsg] = useState("");
  const snapRef = useRef(null);
  snapRef.current = { bByC, rByC, army, marches, soundEnabled };
  const verRef = useRef(account.save.version);
  const lastRaidRef = useRef(0);    // when our castle was last attacked (the save version changes without our own save)
  const revRef = useRef(0);        // counts changes of the game state
  const savedRevRef = useRef(1);   // last change that reached the server (1 = the mount itself is not a change)
  const inflightRef = useRef(false);
  const againRef = useRef(false);
  const stoppedRef = useRef(false);
  const flushedRef = useRef(false);
  const soonTimer = useRef(null);
  const errShownRef = useRef(false);

  useEffect(() => { revRef.current++; }, [bByC, rByC, army, marches, soundEnabled]);

  // Live messages from the server: admin messages, "an admin changed your data", account opened elsewhere
  useEffect(() => {
    const onSrv = (ev) => {
      const m = ev.detail || {};
      if (m.type === "admin_message") showToast("Admin: " + m.text);
      else if (m.type === "save_changed") { stoppedRef.current = true; setConflictMsg("An admin changed your account data. Reload to continue with the updated data."); setConflict(true); }
      else if (m.type === "replaced") { stoppedRef.current = true; setConflictMsg(""); setConflict(true); }
    };
    window.addEventListener("kingdoms:server", onSrv);
    return () => window.removeEventListener("kingdoms:server", onSrv);
  }, [showToast]);

  const buildSave = useCallback(() => {
    const s = snapRef.current, c = culture;
    return {
      buildings: { [c]: s.bByC[c] || [] },
      resources: { [c]: s.rByC[c] },
      army: { troops: { [c]: s.army.troops[c] || {} }, queue: { [c]: s.army.queue[c] || [] } },
      marches: s.marches,
      settings: { sound: s.soundEnabled },
    };
  }, [culture]);

  const saveNow = useCallback(async () => {
    if (stoppedRef.current) return;
    if (inflightRef.current) { againRef.current = true; return; }
    if (revRef.current === savedRevRef.current) return; // nothing new
    inflightRef.current = true;
    const myRev = revRef.current;
    setSaveState("saving");
    try {
      const res = await api.putSave(buildSave(), verRef.current);
      verRef.current = res.version;
      savedRevRef.current = myRev;
      errShownRef.current = false;
      setSaveState("saved");
    } catch (err) {
      if (err.status === 409 && err.data && err.data.code === "stale") {
        // our castle was just attacked: the raid handler is catching up with the server's new version, save again soon
        if (Date.now() - lastRaidRef.current < 15000) setTimeout(saveNow, 1500);
        else { stoppedRef.current = true; setConflict(true); }
      }
      else if (err.status === 401) { stoppedRef.current = true; onAuthLost(); }
      else {
        setSaveState("error");
        if (!errShownRef.current) { errShownRef.current = true; showToast("Cannot save right now - will keep trying"); }
      }
    } finally {
      inflightRef.current = false;
      if (againRef.current && !stoppedRef.current) { againRef.current = false; saveNow(); }
    }
  }, [buildSave, onAuthLost]);

  const saveSoon = useCallback(() => {
    clearTimeout(soonTimer.current);
    soonTimer.current = setTimeout(saveNow, 1500);
  }, [saveNow]);

  useEffect(() => {
    const iv = setInterval(saveNow, 30000);
    return () => clearInterval(iv);
  }, [saveNow]);

  useEffect(() => {
    // Tab hidden / page closing: send the save in a request that survives the page.
    const flush = () => {
      if (stoppedRef.current || inflightRef.current || revRef.current === savedRevRef.current) return;
      flushedRef.current = true;
      api.flushSave({ ...buildSave(), baseVersion: verRef.current });
    };
    // Back on the tab: find out whether that flush reached the server (it changes the version by +1).
    const reconcile = async () => {
      if (!flushedRef.current || stoppedRef.current) return;
      flushedRef.current = false;
      try {
        const { save } = await api.getSave();
        if (save.version === verRef.current + 1) { verRef.current = save.version; savedRevRef.current = revRef.current; }
        else if (save.version !== verRef.current) { stoppedRef.current = true; setConflict(true); }
      } catch (err) { if (err.status === 401) onAuthLost(); }
    };
    const onVis = () => (document.visibilityState === "hidden" ? flush() : reconcile());
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", flush);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("pagehide", flush); };
  }, [buildSave, onAuthLost]);

  const logout = async () => {
    clearTimeout(soonTimer.current);
    await saveNow();
    for (let i = 0; i < 30 && inflightRef.current; i++) await new Promise((r) => setTimeout(r, 100));
    stoppedRef.current = true;
    onLogout();
  };

  // ===== NPC CAMPS: attacks are decided by the SERVER =====
  // The game saves first, then asks the server; the server takes the troops from the saved army and later
  // hands back survivors + loot. We adopt what it answers (troops, resources, version).
  const [expeds, setExpeds] = useState([]);
  const expOffsetRef = useRef(0);               // serverNow - Date.now()
  const [expOffset, setExpOffset] = useState(0);
  const [campSel, setCampSel] = useState(null); // { camp, home, rules }
  const [reports, setReports] = useState(null);
  const expBusyRef = useRef(false);
  const lastFetchRef = useRef(0);
  const serverNow = useCallback(() => Date.now() + expOffsetRef.current, []);
  const syncClock = (now) => { if (now) { expOffsetRef.current = now - Date.now(); setExpOffset(expOffsetRef.current); } };

  const flushSaved = useCallback(async () => {
    for (let i = 0; i < 50; i++) {
      if (stoppedRef.current) return false;
      if (!inflightRef.current && revRef.current === savedRevRef.current) return true;
      if (!inflightRef.current) await saveNow(); else await new Promise((r) => setTimeout(r, 100));
    }
    return false;
  }, [saveNow]);

  const adoptServer = useCallback((save) => {
    verRef.current = save.version;
    setArmy((prev) => ({ ...prev, troops: { ...prev.troops, [culture]: save.troops } }));
    if (save.resources) setRByC((prev) => ({ ...prev, [culture]: { ...(prev[culture] || {}), ...save.resources } }));
  }, [culture]);

  const handleApiError = useCallback((err) => {
    if (err.status === 401) { stoppedRef.current = true; onAuthLost(); }
    else if (err.status === 409 && err.data && err.data.code === "stale") { stoppedRef.current = true; setConflict(true); }
    else showToast(err.message || "Something went wrong");
  }, [onAuthLost, showToast]);

  const refreshExpeds = useCallback(async () => {
    lastFetchRef.current = Date.now();
    try { const r = await api.getExpeditions(); syncClock(r.now); setExpeds(r.expeditions); } catch (err) { if (err.status === 401) onAuthLost(); }
  }, [onAuthLost]);

  const claimHome = useCallback(async () => {
    if (expBusyRef.current || stoppedRef.current) return;
    expBusyRef.current = true;
    try {
      if (!(await flushSaved())) return;
      const r = await api.claimExpeditions(verRef.current);
      syncClock(r.now);
      if (r.reports.length) {
        adoptServer(r.save);
        setReports(r.reports);
        const won = r.reports.filter((x) => x.win).length;
        showToast(won ? "Victory! Loot has been added to your storage" : "Your army is back");
        await refreshExpeds();
      }
    } catch (err) { handleApiError(err); } finally { expBusyRef.current = false; }
  }, [flushSaved, adoptServer, showToast, refreshExpeds, handleApiError]);

  const attackCamp = useCallback(async (camp, troops) => {
    if (expBusyRef.current) return false;
    expBusyRef.current = true;
    try {
      if (!(await flushSaved())) { showToast("Saving… try again in a moment"); return false; }
      const r = await api.attackCamp({ campId: camp.id, troops, baseVersion: verRef.current });
      syncClock(r.now);
      adoptServer(r.save);
      setExpeds((prev) => [...prev, r.expedition]);
      setCampSel(null);
      showToast("Army sent to " + camp.name);
      return true;
    } catch (err) { handleApiError(err); return false; } finally { expBusyRef.current = false; }
  }, [flushSaved, adoptServer, showToast, handleApiError]);

  // ===== PLAYER VS PLAYER: attack another castle, set the castle defense, get raided =====
  // A castle attack is instant and decided by the SERVER (like the camps: save first, send the save version, adopt the answer).
  // The defense formation is kept on the server too; it is checked against the SAVED army, so we save before we open it.
  const [castleSel, setCastleSel] = useState(null);   // another player's castle that was tapped on the map
  const [fm, setFm] = useState(null);                 // open formation editor: { mode, config, castle?, initial?, army?, key }
  const [fmBusy, setFmBusy] = useState(false);
  const [castleReport, setCastleReport] = useState(null);
  const [raid, setRaid] = useState(null);             // "your castle was attacked" message from the server
  const pvpBusyRef = useRef(false);
  const battleCfgRef = useRef(null);

  const loadBattleConfig = useCallback(async () => {
    if (!battleCfgRef.current) battleCfgRef.current = await api.getBattleConfig();
    return battleCfgRef.current;
  }, []);

  // the battle numbers (caps, bonuses, counters) are needed by the camp sheet and the guide too
  useEffect(() => { loadBattleConfig().then(setBattleCfg).catch(() => {}); }, [loadBattleConfig]);

  // Letters + reports: unread counter, live notices
  const openMail = useCallback((tab, focus) => { setMailTab(tab || "report"); setMailFocus(focus || null); setMailOpen(true); setBattleOpen(false); setRaid(null); }, []);
  useEffect(() => { battleApi.getMail(null, 1).then((r) => setMailUnread(r.unread)).catch(() => {}); }, []);
  useEffect(() => {
    const onSrv = (ev) => {
      const m = ev.detail || {};
      if (m.type !== "mail" || !m.mail) return;
      setMailUnread((u) => ({ ...u, [m.mail.kind]: (u[m.mail.kind] || 0) + 1 }));
      setMailTick((n) => n + 1);
      if (m.mail.kind === "letter") showToast("New letter from " + (m.mail.fromName || "a player"));
    };
    window.addEventListener("kingdoms:server", onSrv);
    return () => window.removeEventListener("kingdoms:server", onSrv);
  }, [showToast]);

  const openAttackEditor = useCallback(async (castle) => {
    try {
      const config = await loadBattleConfig();
      setCastleSel(null);
      setFm({ mode: "attack", config, castle, key: "a" + Date.now() });
    } catch (err) { handleApiError(err); }
  }, [loadBattleConfig, handleApiError]);

  const openDefenseEditor = useCallback(async () => {
    if (pvpBusyRef.current) return;
    pvpBusyRef.current = true;
    try {
      if (!(await flushSaved())) { showToast("Saving… try again in a moment"); return; }
      const [config, d] = await Promise.all([loadBattleConfig(), api.getDefense()]);
      setBattleOpen(false);
      setRaid(null);
      setFm({ mode: "defense", config, initial: d.layout, army: d.army, key: "d" + Date.now() });
    } catch (err) { handleApiError(err); } finally { pvpBusyRef.current = false; }
  }, [flushSaved, loadBattleConfig, showToast, handleApiError]);

  const submitFormation = useCallback(async (layout) => {
    if (!fm || pvpBusyRef.current) return;
    pvpBusyRef.current = true;
    setFmBusy(true);
    try {
      if (fm.mode === "defense") {
        await api.setDefense(layout);
        setFm(null);
        showToast("Defense saved");
      } else {
        if (!(await flushSaved())) { showToast("Saving… try again in a moment"); return; }
        const r = await api.attackCastle({ castleId: fm.castle.id, layout, baseVersion: verRef.current });
        syncClock(r.now);
        adoptServer(r.save);
        setFm(null);
        setCastleReport(r.report);
        showToast(r.report.win ? "Victory! The loot is in your storage" : "Defeat. Your army fought hard");
      }
    } catch (err) { handleApiError(err); } finally { pvpBusyRef.current = false; setFmBusy(false); }
  }, [fm, flushSaved, adoptServer, showToast, handleApiError]);

  // Somebody attacked OUR castle. The server already took the losses and the loot out of its copy of our save, and this
  // client is the one that writes the save, so: take the server's new version, apply the same losses and loot here, save.
  const onAttacked = useCallback(async (m) => {
    if (stoppedRef.current) return;
    lastRaidRef.current = Date.now();
    try {
      const { save } = await api.getSave();
      verRef.current = save.version;
    } catch (err) { if (err.status === 401) { stoppedRef.current = true; onAuthLost(); } return; }
    setArmy((prev) => {
      const cur = { ...(prev.troops[culture] || {}) };
      for (const [id, n] of Object.entries(m.losses || {})) { cur[id] = Math.max(0, (cur[id] || 0) - n); if (!cur[id]) delete cur[id]; }
      return { ...prev, troops: { ...prev.troops, [culture]: cur } };
    });
    setRByC((prev) => {
      const cur = { ...(prev[culture] || {}) };
      for (const [k, n] of Object.entries(m.loot || {})) cur[k] = Math.max(0, (cur[k] || 0) - n);
      return { ...prev, [culture]: cur };
    });
    setRaid(m);
    showToast((m.by || "Someone") + " attacked your castle" + (m.win ? " and was beaten back" : ""));
    saveSoon();
  }, [culture, onAuthLost, showToast, saveSoon]);

  useEffect(() => {
    const onSrv = (ev) => { const m = ev.detail || {}; if (m.type === "attacked") onAttacked(m); };
    window.addEventListener("kingdoms:server", onSrv);
    return () => window.removeEventListener("kingdoms:server", onSrv);
  }, [onAttacked]);

  useEffect(() => { refreshExpeds(); }, [refreshExpeds]);
  useEffect(() => {
    const onEvt = () => { refreshExpeds().then(claimHome); };
    window.addEventListener("kingdoms:expedition", onEvt);
    return () => window.removeEventListener("kingdoms:expedition", onEvt);
  }, [refreshExpeds, claimHome]);
  // 1 s: an army that is home is collected; one that has just arrived gets its report; slow fallback poll
  const [, setClockTick] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => {
      setClockTick((n) => n + 1);
      const t = serverNow();
      const list = expedsRef.current;
      if (list.some((x) => t >= x.returnAt + 500)) claimHome();
      else if (list.some((x) => t >= x.arriveAt + 1500 && !x.report) && Date.now() - lastFetchRef.current > 3000) refreshExpeds();
      else if (Date.now() - lastFetchRef.current > 30000) refreshExpeds();
    }, 1000);
    return () => clearInterval(iv);
  }, [serverNow, claimHome, refreshExpeds]);
  const expedsRef = useRef([]);
  expedsRef.current = expeds;

  // City image dimensions calculation
  useEffect(() => {
    const el = stageRef.current; if (!el) return;
    const update = () => setMapH(Math.max(el.clientHeight, el.clientWidth / (3174 / 1344)));
    update();
    const ro = new ResizeObserver(update); ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Production tick (1s) & Marches update
  useEffect(() => {
    const iv = setInterval(() => {
      // 1. Resources
      setBByC((prev) => {
        const next = { ...prev };
        [culture].forEach((c) => {
          next[c] = (next[c] || []).map((b) => {
            if (!b.produces) return b;
            const prev0 = b.stored || 0;
            const stored = Math.min(prev0 + productionRate(b.level), capacity(b.level));
            if (stored === prev0) return b;
            const readyAt = (prev0 < 1 && stored >= 1) ? Date.now() : (b.readyAt || 0);
            return { ...b, stored, readyAt };
          });
        });
        return next;
      });

      // 2. Marches
      setMarches((prev) => {
        return prev.map(m => {
          const timeLeft = m.timeLeft - 1;
          const progress = Math.min(1, 1 - (timeLeft / 12));
          const x = m.originX + (m.targetX - m.originX) * progress;
          const y = m.originY + (m.targetY - m.originY) * progress;
          return { ...m, x, y, timeLeft };
        }).filter(m => {
          if (m.timeLeft <= 0) {
            showToast("Scout expedition arrived at destination!");
            return false;
          }
          return true;
        });
      });
    }, 1000);
    return () => clearInterval(iv);
  }, [showToast, culture]);

  const spawnPop = (id, text, icon) => {
    const pid = ++popId.current;
    setPops((p) => [...p, { id: pid, bid: id, text, icon }]);
    setTimeout(() => setPops((p) => p.filter((x) => x.id !== pid)), 950);
  };

  const collect = (building, srcEl) => {
    const amount = Math.floor(building.stored || 0);
    if (amount < 1) return;
    sound.playCollect();
    flyCollect(srcEl, building.produces, amount);
    setBByC((prev) => ({ ...prev, [culture]: prev[culture].map((b) => b.id === building.id ? { ...b, stored: 0, readyAt: 0 } : b) }));
    setRByC((prev) => ({ ...prev, [culture]: { ...prev[culture], [building.produces]: prev[culture][building.produces] + amount } }));
    spawnPop(building.id, "+" + fmt(amount), RES_ICON[building.produces]);
    showToast("+" + fmt(amount) + " " + theme.resourceNames[building.produces]);
    saveSoon();
  };

  const upgrade = (building, cost) => {
    sound.playUpgrade();
    setRByC((prev) => ({ ...prev, [culture]: { ...prev[culture], wood: prev[culture].wood - cost.wood, stone: prev[culture].stone - cost.stone, coin: prev[culture].coin - cost.coin } }));
    setBByC((prev) => ({ ...prev, [culture]: prev[culture].map((b) => b.id === building.id ? { ...b, level: b.level + 1 } : b) }));
    setSelectedId(null);
    showToast((theme.labels[building.id] || { name: building.id }).name + " → Level " + (building.level + 1));
    saveSoon();
  };

  const train = (troop, count, unitCost) => {
    sound.playUpgrade();
    setRByC((prev) => {
      const r = { ...prev[culture] };
      for (const [k, v] of Object.entries(unitCost)) r[k] = r[k] - v * count;
      return { ...prev, [culture]: r };
    });
    setArmy((prev) => {
      const q = prev.queue[culture] || [];
      const start = q.length ? q[q.length - 1].endsAt : Date.now();
      const job = { id: Date.now() + "_" + Math.random().toString(36).slice(2, 6), troopId: troop.id, count, endsAt: start + troopUnitTime(troop) * count * 1000 };
      return { ...prev, queue: { ...prev.queue, [culture]: [...q, job] } };
    });
    showToast("Training " + count + " × " + troop.name);
    saveSoon();
  };

  const toggleSound = () => {
    const next = !soundEnabled;
    sound.enabled = next;
    setSoundEnabled(next);
    showToast(next ? "Sound FX Enabled" : "Sound Muted");
  };

  // Animated switch between the World Map and the City (see runtime/ui/ViewTransition.js).
  const goView = (mode, origin) => {
    if (mode === viewMode) return;
    sound.playFly();
    switchView({
      stage: stageRef.current, from: viewMode, to: mode, origin,
      apply: (m) => ReactDOM.flushSync(() => setViewMode(m)),
    });
  };

  const now = Date.now();
  const resKeys = ["food", "wood", "stone", "iron"];

  return e("div", { style: { height: "100%", display: "flex", flexDirection: "column", ...vars } },
    // Top HUD
    e("div", { className: "hud-top" },
      e("div", { className: "hud-row1" },
        e("div", { className: "player-chip" },
          e("div", { className: "realm-crest" }, Icon("crown")),
          e("div", { className: "player-meta" },
            e("b", null, account.user.username),
            e("span", null, (themes[culture] && themes[culture].kingdomName) || (themes[culture] && themes[culture].name) || culture))),
        e("button", { className: "menu-toggle", onClick: () => { sound.playClick(); setMenuOpen(true); }, "aria-label": "Menu" }, Icon("menu"))),
      // All five resources are always visible (no sideways scrolling)
      e("div", { className: "ledger" },
        resKeys.map((r) => e("div", { key: culture + "-" + r, className: "ledger-cell", "data-res": r, title: theme.resourceNames[r] }, Icon(RES_ICON[r]), e("b", null, e(CountNum, { value: resources[r], res: r })))),
        e("div", { key: culture + "-coin", className: "ledger-cell coin", "data-res": "coin", title: "Coins" }, Icon("coin"), e("b", null, e(CountNum, { value: resources.coin, res: "coin" }))))),

    // Main Stage Area (Dual View)
    e("div", { className: "stage", ref: stageRef },
      // The world map stays mounted (hidden) while you are in the city, so the
      // castles and the map don't reload every time you switch views.
      e(WorldMapView, {
        active: viewMode === "world",
        culture,
        onJoin: (c, player) => { showToast("Welcome, " + player.name + "!"); },
        onNotice: showToast,
        onAuthLost,
        onCastleSelect: (castle) => setCastleSel(castle),
        onCampSelect: (camp, extra) => setCampSel({ camp, home: extra.home, rules: extra.rules }),
        expeds, expOffset,
        onOpenCity: (origin) => goView("city", origin),
        marches,
        onAddMarch: (m) => setMarches((prev) => [...prev, m])
      }),
      viewMode === "city" &&
        e("div", { className: "city-container", ref: scrollerRef, onScroll: () => setHintVisible(false) },
          e("div", { className: "city-inner", style: { "--u": (mapH / 100) + "px", height: mapH + "px" } },
            e("img", { src: `./kingdom_art/${culture}.jpg`, alt: theme.kingdomName, draggable: false }),
            buildings.map((b) => e(Hotspot, {
              key: culture + "-" + b.id, b, theme,
              showCollect: !!b.produces && (b.stored || 0) >= 1,
              active: selectedId === b.id,
              onSelect: (bb) => setSelectedId(bb.id),
              onCollect: collect
            })),
            pops.map((p) => {
              const b = buildings.find((x) => x.id === p.bid); if (!b) return null;
              return e("div", { key: p.id, className: "float-pop", style: { left: (b.x + b.w / 2) + "%", top: (b.y + b.h * 0.5) + "%" } }, Icon(p.icon), p.text);
            })),
          e("div", { className: "scroll-hint" + (hintVisible ? "" : " hide") }, Icon("drag"), "DRAG TO EXPLORE CITY"))
    ),

    // Bottom Navigation HUD
    e("div", { className: "hud-bottom" },
      e("button", { className: "nav-btn" + (viewMode === "city" ? " active" : ""), onClick: () => { sound.playClick(); goView("city"); } }, e("div", { className: "nic" }, Icon("hall")), e("span", null, "City")),
      e("button", { className: "nav-btn" + (viewMode === "world" ? " active" : ""), onClick: () => { sound.playClick(); goView("world"); } }, e("div", { className: "nic" }, Icon("map")), e("span", null, "Map")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setBattleOpen(true); } },
        (marches.length + expeds.length) > 0 && e("span", { className: "badge" }, marches.length + expeds.length),
        e("div", { className: "nic" }, Icon("sword")), e("span", null, "Battle")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setStorageOpen(true); } }, e("div", { className: "nic" }, Icon("chest")), e("span", null, "Storage")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); openMail(mailUnread.report > 0 || mailUnread.letter === 0 ? "report" : "letter"); } },
        (mailUnread.report + mailUnread.letter) > 0 && e("span", { className: "badge" }, mailUnread.report + mailUnread.letter),
        e("div", { className: "nic" }, Icon("mail")), e("span", null, "Letters")),
      e("button", { className: "nav-btn", onClick: () => { sound.playClick(); setRanksOpen(true); } }, e("div", { className: "nic" }, Icon("trophy")), e("span", null, "Ranks"))),

    // Sheets & Overlays
    e(DetailSheet, { building: selected && selected.category !== "barracks" ? selected : null, theme, resources, onClose: () => setSelectedId(null), onCollect: collect, onUpgrade: upgrade }),
    e(BarracksSheet, { open: !!selected && selected.category === "barracks", building: selected, culture, theme, resources, army, onClose: () => setSelectedId(null), onTrain: train }),
    e(MailUI.MailPanel, {
      open: mailOpen, tab: mailTab, onTab: setMailTab, focusId: mailFocus, refreshKey: mailTick, unread: mailUnread, onUnread: setMailUnread,
      onClose: () => { setMailOpen(false); setMailFocus(null); }, onToast: showToast,
      renderChat: () => e(ChatView, { me: account.user.username, active: mailOpen && mailTab === "chat" })
    }),
    guideOpen && battleCfg && e(BattleUI.GuideSheet, { config: battleCfg, onClose: () => setGuideOpen(false) }),
    e(StorageSheet, { open: storageOpen, onClose: () => setStorageOpen(false), resources, buildings, theme }),
    e(BattleSheet, { open: battleOpen, onClose: () => setBattleOpen(false), marches, expeds, serverNow, maxActive: (campSel && campSel.rules && campSel.rules.maxActive) || 3, unreadReports: mailUnread.report, onOpenDefense: openDefenseEditor, onOpenMap: () => { setBattleOpen(false); goView("world"); }, onOpenReports: () => openMail("report"), onOpenGuide: () => { setBattleOpen(false); setGuideOpen(true); } }),
    e(CampSheet, {
      camp: campSel && campSel.camp, home: campSel && campSel.home, rules: campSel && campSel.rules,
      troops: army.troops[culture] || {}, config: battleCfg, activeCount: expeds.length,
      onClose: () => setCampSel(null), onAttack: attackCamp
    }),
    e(ReportSheet, { reports, onClose: () => setReports(null), onOpenAll: () => { setReports(null); openMail("report"); } }),
    castleSel && e(BattleUI.CastleSheet, { castle: castleSel, civName: (civById(castleSel.civId) || {}).name, onClose: () => setCastleSel(null), onAttack: openAttackEditor }),
    fm && e(BattleUI.FormationSheet, {
      key: fm.key, mode: fm.mode, config: fm.config,
      army: fm.mode === "defense" ? fm.army : (army.troops[culture] || {}),
      initial: fm.initial,
      title: fm.mode === "defense" ? "Castle defense" : "Attack " + fm.castle.name,
      subtitle: fm.mode === "defense"
        ? "This is how your troops stand when another player attacks your castle. Your troops are not used up."
        : "We arranged your troops for you. Choose how many to send, then attack. The battle is decided at once.",

    }),

        e("p", { className: "auth-sub" }, conflictMsg || "This account was saved from another tab or device. To keep your newest progress safe, this tab stopped saving."),
        e("button", { className: "auth-btn", onClick: () => location.reload() }, "Reload with latest progress")))
  );
}

// ==========================================
// LOGIN + START (Root)
// ==========================================
function AuthScreen({ onDone, notice }) {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(notice || "");

  const submit = async (ev) => {
    ev.preventDefault();
    if (busy) return;
    const username = name.trim();
    if (mode === "register") {
      if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) return setErr("Username: 3-16 letters, digits or _");
      if (pw.length < 8) return setErr("Password: at least 8 characters");
      if (pw !== pw2) return setErr("The two passwords are different");
    } else if (!username || !pw) return setErr("Enter your username and password");
    setBusy(true); setErr("");
    try {
      if (mode === "register") await api.register(username, pw, remember); else await api.login(username, pw, remember);
      onDone();
    } catch (error) {
      setErr(error.status === 0 ? "Cannot reach the game server" : error.message);
      setBusy(false);
    }
  };

  const field = (label, value, set, type, auto) => e("label", { className: "auth-field" }, label,
    e("input", { type, value, onChange: (ev) => set(ev.target.value), autoComplete: auto, spellCheck: false, autoCapitalize: "off", disabled: busy }));

  return e("div", { className: "auth-screen" },
    e("form", { className: "auth-card", onSubmit: submit },
      e("h1", null, "Kingdoms: Realm & World"),
      e("p", { className: "auth-sub" }, mode === "login" ? "Log in to continue your kingdom" : "Create an account to found your kingdom"),
      e("div", { className: "auth-tabs" },
        e("button", { type: "button", className: mode === "login" ? "on" : "", onClick: () => { setMode("login"); setErr(""); } }, "Log in"),
        e("button", { type: "button", className: mode === "register" ? "on" : "", onClick: () => { setMode("register"); setErr(""); } }, "Register")),
      field("Username", name, setName, "text", "username"),
      field("Password", pw, setPw, "password", mode === "login" ? "current-password" : "new-password"),
      mode === "register" && field("Repeat password", pw2, setPw2, "password", "new-password"),
      e("label", { className: "auth-check" }, e("input", { type: "checkbox", checked: remember, onChange: (ev) => setRemember(ev.target.checked), disabled: busy }), "Remember me on this device"),
      err && e("div", { className: "auth-err", role: "alert" }, err),
      e("button", { type: "submit", className: "auth-btn", disabled: busy }, busy ? "Please wait..." : mode === "login" ? "Log in" : "Create account")));
}

function Root() {
  const [phase, setPhase] = useState("boot"); // boot | down | login | game
  const [message, setMessage] = useState("");
  const [account, setAccount] = useState(null);

  const enter = useCallback(async (notice) => {
    setPhase("boot");
    try {
      if (!(await api.probeServer())) { setMessage("Cannot reach the game server. Start it (npm run server) and try again."); setPhase("down"); return; }
      if (!api.getToken()) { setMessage(notice || ""); setPhase("login"); return; }
      let me;
      try { me = await api.me(); }
      catch (err) { if (err.status === 401) { api.clearToken(); setMessage("Please log in again"); setPhase("login"); return; } throw err; }
      if (!me.culture) {
        // first login of this account: choose the civilization (ONCE - the server refuses any later change)
        const choice = await showJoinScreen({ assetBase: CASTLE_ASSET_BASE, fixedName: me.user.username });
        await api.join(choice.civId);
      }
      const { save } = await api.getSave();
      setAccount({ user: me.user, save });
      setPhase("game");
    } catch (err) {
      setMessage(err.status === 0 ? "Cannot reach the game server. Start it (npm run server) and try again." : "Could not start: " + err.message);
      setPhase("down");
    }
  }, []);

  useEffect(() => { enter(); }, [enter]);

  const logout = async () => { await api.logout(); location.reload(); };
  const authLost = useCallback(() => { api.clearToken(); location.reload(); }, []);

  if (phase === "game") return e(App, { account, onLogout: logout, onAuthLost: authLost });
  if (phase === "login") return e(AuthScreen, { onDone: () => enter(), notice: message });
  if (phase === "down") return e("div", { className: "auth-screen" }, e("div", { className: "auth-card" },
    e("h1", null, "Connection problem"), e("p", { className: "auth-sub" }, message),
    e("button", { className: "auth-btn", onClick: () => enter() }, "Try again")));
  return e("div", { style: { height: "100%", display: "flex", alignItems: "center", justifyContent: "center", color: "#9fb3c2", font: "600 14px Inter,sans-serif" } }, "Loading kingdom & world...");
}

ReactDOM.createRoot(document.getElementById("root")).render(e(Root));
</script>
